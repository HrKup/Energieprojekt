<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lernpfad Energieberatung</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: App wie ein Foliensatz. Links Folienleiste (Miniaturen mit Status), rechts die Folie, unten Blätterleiste. */
:root{
  --bg:#eef3f1; --surface:#ffffff; --ink:#15302a; --muted:#566b65; --line:#cfdcd7;
  --accent:#0e7a63; --accent-ink:#ffffff; --soft:#e0f0ea;
  --done:#1f8a4c; --done-bg:#dff3e6; --open:#b9c4c0;
  --mappe:#a35a00; --mappe-bg:#fff1dc; --proto:#1d5fa8; --proto-bg:#e3eefb;
  --bad:#b3261e; --bad-bg:#fbe7e5; --star:#c98a00;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1917; --surface:#172421; --ink:#e2eeea; --muted:#9db2ab; --line:#2b3d38;
  --accent:#4cc3a3; --accent-ink:#0b1513; --soft:#1b3430;
  --done:#6fd396; --done-bg:#163222; --open:#4a5a55;
  --mappe:#ffb758; --mappe-bg:#3a2a12; --proto:#8cbcf2; --proto-bg:#16283d;
  --bad:#ff9a90; --bad-bg:#3a1c1a; --star:#f2c14e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1917; --surface:#172421; --ink:#e2eeea; --muted:#9db2ab; --line:#2b3d38;
  --accent:#4cc3a3; --accent-ink:#0b1513; --soft:#1b3430;
  --done:#6fd396; --done-bg:#163222; --open:#4a5a55;
  --mappe:#ffb758; --mappe-bg:#3a2a12; --proto:#8cbcf2; --proto-bg:#16283d;
  --bad:#ff9a90; --bad-bg:#3a1c1a; --star:#f2c14e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--accent)}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
/* Kopfleiste */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:4px 2px}
.brand .dot{width:12px;height:12px;border-radius:3px;background:var(--accent)}
.where{color:var(--muted);font-size:.95rem;min-width:0;flex:1}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;width:120px}
.bar>i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.pct{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;min-width:3.2em;text-align:right}
.btn{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.menu-btn{display:none}
/* Mitte */
.mid{display:grid;grid-template-columns:270px 1fr;min-height:0}
.side{border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:12px 10px 20px;display:flex;flex-direction:column;gap:10px}
.side select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.thumbs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.thumb{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);border-left-width:8px;border-left-color:var(--open);background:var(--bg);border-radius:8px;padding:6px 8px;cursor:pointer}
.thumb .n{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:.85rem}
.thumb .t{font-size:.85rem;line-height:1.25;min-width:0}
.thumb .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block}
.thumb.done{border-left-color:var(--done);background:var(--done-bg)}
.thumb.cur{border-color:var(--accent);border-left-color:var(--accent)}
.thumb.done.cur{border-left-color:var(--done)}
.thumb .s{font-size:.9rem}
.legend{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:3px;padding:4px 2px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.stage{overflow-y:auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.slide{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slide h1{font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:800;letter-spacing:-.015em}
.slide h2{font-size:1.25rem;font-weight:600}
.lead{font-size:1.1rem}
.text{max-width:68ch;display:flex;flex-direction:column;gap:12px}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;letter-spacing:.03em;text-transform:none}
.tag.mappe{background:var(--mappe-bg);color:var(--mappe)}
.tag.proto{background:var(--proto-bg);color:var(--proto)}
.tag.screen{background:var(--soft);color:var(--accent)}
.tag.star{background:var(--mappe-bg);color:var(--star)}
.where-box{border-radius:10px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start;font-weight:700}
.where-box.mappe{background:var(--mappe-bg);color:var(--mappe)}
.where-box.proto{background:var(--proto-bg);color:var(--proto)}
.where-box .ic{font-size:1.4rem;line-height:1}
.where-box p{color:var(--ink);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.merk{border-left:6px solid var(--accent);background:var(--soft);border-radius:0 10px 10px 0;padding:12px 16px;font-weight:700}
.formula{font-family:var(--display);font-weight:800;font-size:1.35rem;background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:10px 16px;align-self:flex-start}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bullets{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.task-q{font-size:1.15rem}
details.tip{border:1px dashed var(--accent);border-radius:10px;padding:8px 14px;background:var(--surface)}
details.tip summary{cursor:pointer;font-weight:700;color:var(--accent)}
details.tip[open]{border-style:solid}
details.tip div{padding-top:8px}
.check{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.check label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:700;color:var(--muted)}
.check input,.check select{width:10rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.fb{border-radius:8px;padding:8px 12px;font-size:.95rem}
.fb.ok{background:var(--done-bg);color:var(--done)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.sol{background:var(--soft);border-radius:10px;padding:12px 16px}
.done-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.btn.done-btn[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--accent-ink)}
.small{font-size:.85rem;color:var(--muted)}
/* Effizienzklassen */
.scale{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;border-radius:6px;overflow:hidden;position:relative;margin-top:22px}
.scale div{color:#fff;font-weight:800;text-align:center;padding:10px 2px;font-size:1.2rem;line-height:1.15}
.scale small{display:block;font-weight:600;font-size:.78rem;line-height:1.2;margin-top:3px}
.marker{position:absolute;top:-22px;transform:translateX(-50%);font-size:.8rem;font-weight:700;color:var(--ink)}
.house{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.classes{display:flex;flex-wrap:wrap;gap:4px}
.classes button{padding:4px 9px;min-width:2.4rem;border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:6px;font-weight:700;cursor:pointer}
.classes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.big{font-size:1.5rem;font-weight:700}
/* Schätz-Balken */
.est{display:grid;grid-template-columns:8.5rem 1fr 4rem;gap:6px 12px;align-items:center}
.est .b{height:14px;border-radius:7px;background:var(--line);position:relative;overflow:hidden}
.est .b i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.est .b i.uba{background:var(--mappe)}
.fig{margin:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fig img{max-width:100%;max-height:360px;height:auto;border-radius:8px;background:#fff;border:1px solid var(--line)}
.fig figcaption{font-size:.85rem;color:var(--muted)}
.steck dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
.steck dt{font-weight:700}.steck dd{margin:0}
.tool-frame{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.tool-frame iframe{display:block;width:100%;min-height:520px;border:0}
table.grid td{height:2em}
.tbl{overflow-x:auto}
@media (max-width:520px){.steck dl{grid-template-columns:1fr}.steck dd{margin-bottom:6px}}
ul.daten{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:6px;font-weight:400;color:var(--ink)}
ul.daten label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
ul.daten input{width:1.25rem;height:1.25rem;margin-top:.15rem;flex:none;accent-color:var(--done)}
ul.daten li.hab span{color:var(--muted)}
.offen{font-weight:700;margin-top:6px}
/* Startseite */
.chap-list{display:grid;gap:10px}
.chap{display:grid;grid-template-columns:2.4rem 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.chap .num{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--accent);text-align:center}
.chap[disabled]{cursor:default;opacity:.55}
.chap .bar{width:100%;margin-top:6px}
.chap .meta{font-size:.85rem;color:var(--muted)}
.code-box{font-family:ui-monospace,Consolas,monospace;font-size:1rem;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;user-select:all}
textarea{width:100%;min-height:4.5rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:10px;font-family:ui-monospace,Consolas,monospace}
.plan{overflow-x:auto}
.plan td.on{background:var(--mappe-bg)}
.plan td.on::after{content:"●";color:var(--mappe)}
.plan td{text-align:center}
.plan td:first-child{text-align:left}
/* Fußleiste */
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-top:1px solid var(--line)}
.foot .count{font-variant-numeric:tabular-nums;font-weight:700}
.foot .grp{display:flex;gap:8px}
/* Dialog */
.overlay{position:fixed;inset:0;background:rgba(10,20,18,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dialog{background:var(--surface);border-radius:14px;max-width:560px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
@media (max-width:900px){
  .mid{grid-template-columns:1fr}
  .side{display:none;position:fixed;inset:56px 0 64px 0;z-index:15;border-right:0}
  .side.show{display:flex}
  .menu-btn{display:inline-block}
  .bar.top-bar{width:70px}
  .where{flex-basis:100%;order:5}
}
@media (max-width:520px){.scale div{font-size:.95rem;padding:8px 1px}.scale small{font-size:.6rem}.house{grid-template-columns:1fr}.est{grid-template-columns:6.5rem 1fr 3.4rem}.foot .first{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <button class="btn ghost menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">Folien</button>
    <button class="brand" id="homeBtn" title="Zur Übersicht"><span class="dot"></span>Energieberatung</button>
    <span class="where" id="where"></span>
    <span class="bar top-bar" aria-hidden="true"><i id="topBar"></i></span><span class="pct" id="topPct"></span>
    <button class="btn primary" id="saveBtn">Fortschritt sichern</button>
  </header>
  <div class="mid">
    <nav class="side" id="side" aria-label="Folien">
      <select id="chapSel" aria-label="Teil wählen"></select>
      <ol class="thumbs" id="thumbs"></ol>
      <div class="legend"><span style="--c:var(--done)">grün: erledigt</span><span style="--c:var(--open)">grau: noch offen</span><span style="--c:var(--accent)">Rahmen: hier bist du</span></div>
    </nav>
    <main class="stage" id="stage"><div class="slide" id="slide"></div></main>
  </div>
  <footer class="foot" id="foot">
    <div class="grp"><button class="btn ghost first" id="firstBtn">Erste Folie</button><button class="btn ghost" id="prevBtn">Zurück</button></div>
    <span class="count" id="count"></span>
    <button class="btn primary" id="nextBtn">Weiter</button>
  </footer>
</div>
<div class="overlay" id="ov" hidden><div class="dialog" id="dlg" role="dialog" aria-modal="true"></div></div>

<script>
/* ---------- Hilfen ---------- */
const $=s=>document.querySelector(s);
const de=(n,d=2)=>Number(n).toLocaleString("de-DE",{maximumFractionDigits:d});
const num=v=>parseFloat(String(v).replace(/\s| /g,"").replace(",","."));
const MAPPE='<div class="where-box mappe"><span class="ic">✎</span><div>In deine Mappe<p>Schreib den Rechenweg und das Ergebnis mit Einheit in deine Mappe. Hier kannst du dein Ergebnis danach prüfen.</p></div></div>';
function tips(list){return list.map((t,i)=>`<details class="tip"><summary>Tipp ${i+1}${list.length>1&&i==list.length-1?" (fast die Lösung)":""}</summary><div>${t}</div></details>`).join("");}
/* Prüffelder: [label, richtig, Toleranz, Einheit] */
function checker(id,fields,solution){
  return `<div class="card"><h2>Ergebnis prüfen</h2><div class="check">${fields.map((f,i)=>`<label for="${id}_${i}">${f[0]}<input id="${id}_${i}" inputmode="decimal" autocomplete="off" placeholder="${f[3]}"></label>`).join("")}<button class="btn" data-check="${id}">Prüfen</button></div><div class="fb" id="${id}_fb" hidden></div><details class="tip"><summary>Lösung anzeigen</summary><div class="sol">${solution}</div></details></div>`;
}
const CHECKS={};
const UNITS="W|kW|kWh|Wh|MWh|€|ct|%|°C|°|K|m²|m³|kg|g|t|h|min|s|Jahre|Jahr|Liter|l|lm|cm|mm|m|Personen|Prozent";
const RE_TH=/(\d) (\d{3})(?!\d)/g, RE_U=new RegExp("(\\d) ("+UNITS+")(?![\\wäöüß])","g");
function nb(h){return h.replace(/>([^<]+)</g,(m,t)=>">"+t.replace(RE_TH,"$1\u00a0$2").replace(RE_TH,"$1\u00a0$2").replace(RE_U,"$1\u00a0$2")+"<");}
function regCheck(id,fields){CHECKS[id]=fields;}

/* ---------- Inhalte ---------- */
const CH_MORE=[{"id": "teil2", "short": "Teil 2", "title": "Wände und Wärme", "slides": [{"k": "info", "t": "Darum geht es", "h": "<div class=\"eyebrow\">Teil 2 · Wände und Wärme</div><h1>Darum geht es</h1><div class=\"text\"><p class=\"lead\">Ein Haus oder eine Wohnung verliert ständig Wärme an die Umgebung. Du lernst, auf welchen Wegen das passiert, welche Bauteile besonders viel Wärme verlieren und wie Dämmstoffe dagegen helfen.</p></div><div class=\"where-box proto\"><span class=\"ic\">▤</span><div>Bevor du beginnst<p>Hake ab, welche Daten von zu Hause du schon hast. Was noch fehlt, notierst du als Hausaufgabe.</p><ul class=\"daten\"><li>Baumaterial der Außenwände (zum Beispiel Ziegel, Kalksandstein, Beton, Holz) und ob sie gedämmt sind</li><li>Dämmmaterial, Dicke und Alter der Dämmung (Eltern oder Vermieter fragen)</li><li>Wanddicke: Miss sie mit dem Zollstock an einem geöffneten Fenster oder an der Haustür (an der Laibung, also der Innenseite der Maueröffnung).</li><li>Sind die Kellerwände bzw. die Kellerdecke gedämmt?</li></ul></div></div>"}, {"k": "info", "n": "2.1", "t": "Wohin geht die Wärme?", "h": "<div class=\"eyebrow\">Teil 2 · Info 1 von 4</div><h1>Wohin geht die Wärme?</h1><div class=\"text\"><p>Im Winter ist es drinnen 20 °C warm, draußen vielleicht 0 °C. Wärme fließt immer vom Warmen zum Kalten, also aus dem Haus hinaus. Die Heizung muss genau so viel Wärme nachliefern, wie verloren geht. Wo die Wärme ein unsaniertes Einfamilienhaus verlässt, zeigt das Beispielhaus: <b>Von der gesamten Wärme, die es verliert</b>, gehen etwa 30 % durch die Außenwände, 25 % durch das Dach, 25 % durch Fenster und Türen, 10 % durch Lüften und Ritzen und 10 % über Boden und Keller. Zusammen sind das 100 %. Bei jedem Haus sind die Anteile etwas anders. In einer Wohnung im Mehrfamilienhaus grenzen viele Wände an beheizte Nachbarwohnungen, dort geht weniger Wärme verloren.</p></div><figure class=\"fig\"><img src=\"fig/haus.png\" alt=\"Wärmeverluste eines unsanierten Beispielhauses (gerundet, nach Angaben von Umweltbundesamt und co2online)\" loading=\"lazy\"><figcaption>Wärmeverluste eines unsanierten Beispielhauses (gerundet, nach Angaben von Umweltbundesamt und co2online)</figcaption></figure>"}, {"k": "info", "n": "2.1", "t": "Drei Wege des Wärmetransports", "h": "<div class=\"eyebrow\">Teil 2 · Info 2 von 4</div><h1>Drei Wege des Wärmetransports</h1><figure class=\"fig\"><img src=\"fig/transport.png\" alt=\"transport\" loading=\"lazy\"></figure><div class=\"text\"><p><b>Wärmeleitung:</b> Wärme wandert durch einen Stoff von der warmen zur kalten Seite, zum Beispiel durch eine Hauswand nach draußen. Metalle, Beton und Glas leiten Wärme gut, ruhende Luft sehr schlecht. Deshalb bestehen Dämmstoffe aus vielen kleinen, eingeschlossenen Luftbläschen oder Fasern. <b>Wärmeströmung (Konvektion):</b> Warme Luft steigt nach oben, kalte sinkt. So verteilt sich die Wärme vom Heizkörper im Raum. Durch Ritzen und gekippte Fenster strömt die warme Luft aber auch nach draußen. <b>Wärmestrahlung:</b> Jeder warme Körper sendet unsichtbare Infrarotstrahlung aus, auch ohne Luft dazwischen. Glänzende Flächen werfen sie zurück. Wärmebildkameras machen diese Strahlung sichtbar.</p></div>"}, {"k": "info", "n": "2.1", "t": "Baustoffe und Dämmstoffe", "h": "<div class=\"eyebrow\">Teil 2 · Info 3 von 4</div><h1>Baustoffe und Dämmstoffe</h1><div class=\"text\"><p>Die Wärmeleitfähigkeit λ (gesprochen „Lambda“) gibt an, wie gut ein Stoff Wärme leitet. Je kleiner λ, desto besser dämmt er. Die Einheit W/(m·K) bedeutet: So viele Watt fließen durch einen Würfel aus diesem Stoff mit 1 m Kantenlänge, wenn eine Seite 1 °C wärmer ist als die gegenüberliegende. Eine Schicht muss umso dicker sein, je größer λ ist: 10 cm Polystyrol dämmen etwa so gut wie 2,3 m Vollziegel. Dämmstoffe teilt man in drei Gruppen ein: mineralische (zum Beispiel Stein- und Glaswolle), Kunststoffe (zum Beispiel Polystyrol) und nachwachsende Dämmstoffe (zum Beispiel Holzfaser, Zellulose, Hanf).</p></div><div class=\"card tbl\"><table><thead><tr><th>Stoff</th><th>λ in W/(m·K)</th><th>Stoff</th><th>λ in W/(m·K)</th></tr></thead><tbody><tr><td>Stahlbeton</td><td>2,0</td><td>Holz (Nadelholz)</td><td>0,13</td></tr><tr><td>Vollziegel</td><td>0,8</td><td>Mineralwolle</td><td>0,035</td></tr><tr><td>Kalksandstein</td><td>0,9</td><td>Polystyrol („Styropor“)</td><td>0,035</td></tr><tr><td>Porenbeton</td><td>0,1 bis 0,2</td><td>Holzfaser, Zellulose</td><td>0,04</td></tr><tr><td>Fensterglas</td><td>1,0</td><td>ruhende Luft</td><td>0,025</td></tr></tbody></table></div>"}, {"k": "info", "n": "2.1", "t": "Was bringt es, die Außenwand zu dämmen?", "h": "<div class=\"eyebrow\">Teil 2 · Info 4 von 4</div><h1>Was bringt es, die Außenwand zu dämmen?</h1><div class=\"text\"><p>Eine Dämmung der Außenwand senkt <b>den Wärmeverlust der Wand</b> um 65 bis 80 %. Fürs ganze Haus sind das (siehe Prozentrechnung in Teil 1) meist 20 bis 25 % weniger Heizenergie. Außendämmung ist teuer und lohnt sich vor allem, wenn die Fassade ohnehin erneuert werden muss. Mieterinnen und Mieter entscheiden das nicht selbst, können aber zum Beispiel Heizkörpernischen dämmen lassen oder den Vermieter darauf ansprechen.</p></div><div class=\"card steck\"><h2>Steckbrief: Außenwand dämmen (Einfamilienhaus)</h2><dl><dt>Kosten (ca.)</dt><dd>150 bis 250 € pro m² Wandfläche</dd><dt>Einsparung</dt><dd>etwa 20 bis 25 % der Heizenergie</dd><dt>CO₂</dt><dd>bei Gasheizung etwa 0,9 t pro Jahr (Beispielhaus)</dd><dt>Lohnt sich nach</dt><dd>oft erst nach 15 bis 30 Jahren</dd></dl></div>"}, {"k": "task", "n": "2.2", "t": "Übung: Dämm-Quiz", "h": "<div class=\"eyebrow\">Teil 2 · Aufgabe 2.2 <span class=\"tag screen\">● hier am Bildschirm</span></div><h1>Übung: Dämm-Quiz</h1><p class=\"task-q\">Ordne die Alltagsbeispiele den drei Arten des Wärmetransports zu. Vergleiche dann mit dem Dicken-Rechner, wie dick eine Wand aus verschiedenen Stoffen sein müsste, um so gut zu dämmen wie 10 cm Styropor.</p><div class=\"tool-frame\"><iframe src=\"tools/daemm-quiz.html\" title=\"Dämm-Quiz\" loading=\"lazy\"></iframe></div>"}, {"k": "task", "n": "2.3", "t": "Erläutere, welche Wärmeverluste bei einer Thermoskanne …", "h": "<div class=\"eyebrow\">Teil 2 · Aufgabe 2.3 <span class=\"tag mappe\">✎ Mappe</span> <span class=\"tag star\">★ freiwillig</span></div><h1>Erläutere, welche Wärmeverluste bei einer Thermoskanne …</h1><p class=\"task-q\">Erläutere, welche Wärmeverluste bei einer Thermoskanne durch den Deckel, durch die verspiegelte Innenwand und durch das Vakuum zwischen den Wänden verringert werden. Nenne jeweils ein Bauteil eines Hauses, das dieselbe Aufgabe erfüllt.</p><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Bearbeite die Aufgabe in deiner Mappe.</p></div></div>", "star": true}, {"k": "task", "n": "2.4", "t": "Informiere dich auf der Seite „Wände und Fenster richtig …", "h": "<div class=\"eyebrow\">Teil 2 · Aufgabe 2.4 <span class=\"tag mappe\">✎ Mappe</span> <span class=\"tag star\">★ freiwillig</span></div><h1>Informiere dich auf der Seite „Wände und Fenster richtig …</h1><p class=\"task-q\">Informiere dich auf der Seite <a href=\"https://www.umweltbundesamt.de/umwelttipps-fuer-den-alltag/weniger-waermeverluste-mehr-komfort-waende-fenster\" target=\"_blank\" rel=\"noopener\">„Wände und Fenster richtig dämmen“ (Umweltbundesamt)</a> über die drei Gruppen von Dämmstoffen. Du brauchst nur einen kurzen Abschnitt: Scrolle zur Überschrift <b>„Gewusst wie“</b> und lies dort den fett gedruckten Absatz <b>„Dämmstoffe“</b> (er steht nach „Fenster“). Schneller geht es mit <b>Strg + F</b> und dem Suchwort „Dämmstoffe“. Trage je Gruppe ein Beispiel, einen Vorteil und einen Nachteil in eine Tabelle in deiner Mappe ein.</p><div class=\"card\"><h2>Diese Tabelle legst du in deiner Mappe an</h2><div class=\"tbl\"><table class=\"grid\"><thead><tr><th>Dämmstoffgruppe</th><th>Beispiel</th><th>Vorteil</th><th>Nachteil</th></tr></thead><tbody><tr><td>mineralisch</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>Kunststoff</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>nachwachsend</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div></div><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Bearbeite die Aufgabe in deiner Mappe.</p></div></div><details class=\"tip\"><summary>Tipp 1</summary><div>Im Absatz „Dämmstoffe“ kommen die drei Gruppen nacheinander: erst die <b>mineralischen</b> (Steinwolle, Glaswolle), dann die aus <b>Kunststoff</b> (Polystyrol, aus Erdöl), dann die <b>natürlichen</b> (zum Beispiel Holzfaser, Stroh, Zellulose aus Altpapier). Den Rest der Seite brauchst du nicht.</div></details><details class=\"tip\"><summary>Tipp 2</summary><div>Nicht jeder Nachteil steht auf der Seite. Hier sind Hilfen: Mineralwolle kratzt bei der Verarbeitung und ihre Herstellung braucht viel Energie (siehe auch Teil 4). Kunststoff wird aus Erdöl hergestellt und lässt sich schwer recyceln. Nachwachsende Dämmstoffe dämmen etwas schlechter, die Schicht muss also dicker sein.</div></details>", "star": true}, {"k": "task", "n": "2.5", "t": "Ein Haus verliert im Jahr 20 000 kWh Wärme, davon 35 % …", "h": "<div class=\"eyebrow\">Teil 2 · Aufgabe 2.5 <span class=\"tag mappe\">✎ Mappe</span> <span class=\"tag star\">★ freiwillig</span></div><h1>Ein Haus verliert im Jahr 20 000 kWh Wärme, davon 35 % …</h1><p class=\"task-q\">Ein Haus verliert im Jahr 20 000 kWh Wärme, davon 35 % über die Außenwände. Eine Dämmung senkt den Wandverlust um 70 %.</p><ul class=\"bullets\" style=\"list-style:none;padding-left:0\"><li>a) Berechne, wie viele kWh das Haus über die Wände verliert.</li><li>b) Berechne die Einsparung in kWh und in € (Erdgas, 0,12 € pro kWh).</li><li>c) Berechne, wie viel Prozent der gesamten Heizenergie das sind.</li><li>d) Die Dämmung kostet 24 000 €. Berechne die Amortisationszeit und beurteile das Ergebnis.</li></ul><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Schreib den Rechenweg und die Ergebnisse mit Einheit in deine Mappe. Hier kannst du sie danach prüfen.</p></div></div><details class=\"tip\"><summary>Tipp 1</summary><div>a) Wie viel geht durch die Wände? 35 % von 20 000 kWh: 20 000 kWh · 35 : 100 = 7 000 kWh.</div></details><details class=\"tip\"><summary>Tipp 2</summary><div>b) Die Dämmung spart 70 % von diesen 7 000 kWh: 7 000 kWh · 70 : 100 = … kWh. Für das Geld nimmst du das Ergebnis mal 0,12 €.</div></details><details class=\"tip\"><summary>Tipp 3</summary><div>c) Teile die Einsparung durch die 20 000 kWh des ganzen Hauses und nimm mal 100. d) 24 000 € geteilt durch die Ersparnis pro Jahr in €.</div></details><div class=\"card\"><h2>Ergebnis prüfen</h2><div class=\"check\"><label for=\"c2_5_0\">a) Verlust über die Wände<input id=\"c2_5_0\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"kWh\"></label><label for=\"c2_5_1\">b) Einsparung<input id=\"c2_5_1\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"kWh\"></label><label for=\"c2_5_2\">b) Einsparung<input id=\"c2_5_2\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"€\"></label><label for=\"c2_5_3\">c) Anteil am ganzen Haus<input id=\"c2_5_3\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"%\"></label><label for=\"c2_5_4\">d) Amortisationszeit<input id=\"c2_5_4\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"Jahre\"></label><button class=\"btn\" data-check=\"c2_5\">Prüfen</button></div><div class=\"fb\" id=\"c2_5_fb\" hidden></div><details class=\"tip\"><summary>Lösung anzeigen</summary><div class=\"sol\">a) 20 000 kWh · 35 : 100 = <b>7 000 kWh</b><br>b) 7 000 kWh · 70 : 100 = <b>4 900 kWh</b>; 4 900 kWh · 0,12 € = <b>588 €</b><br>c) 4 900 : 20 000 · 100 = <b>24,5 %</b><br>d) 24 000 € : 588 € pro Jahr ≈ <b>41 Jahre</b>. Das ist sehr lang. Nur wegen der Heizkosten lohnt sich die Dämmung kaum, sinnvoll ist sie, wenn die Fassade ohnehin erneuert wird.</div></details></div>", "star": true}, {"k": "switch", "t": "Jetzt ins Protokoll", "h": "<div class=\"eyebrow\">Teil 2 · Wechsel <span class=\"tag proto\">▤ Protokoll</span></div><h1>Jetzt arbeitest du im Protokoll weiter</h1><div class=\"where-box proto\"><span class=\"ic\">▤</span><div>Öffne dein Protokoll, Teil 2<p>Dort arbeitest du mit den Zahlen deiner eigenen Wohnung oder deines Hauses.</p></div></div><div class=\"card\"><ol class=\"bullets\"><li>Trag die <b>Daten</b> ein, die du zu Hause erhoben hast.</li><li>Bearbeite <b>Aufgabe 2.1</b>.</li><li>Schreib unter <b>Für dein Gutachten</b> deine Stichpunkte.</li></ol></div><p class=\"small\">Klicke auf „Aufgabe erledigt“, wenn du Teil 2 im Protokoll fertig hast.</p>"}]}, {"id": "teil3", "short": "Teil 3", "title": "Wärmebilder", "slides": [{"k": "info", "t": "Darum geht es", "h": "<div class=\"eyebrow\">Teil 3 · Wärmebilder</div><h1>Darum geht es</h1><div class=\"text\"><p class=\"lead\">Mit einer Wärmebildkamera siehst du, wo deine Wohnung oder dein Haus Wärme verliert. Damit deine Bilder aussagekräftig sind, lernst du hier, wie die Kamera funktioniert und worauf du achten musst. Bearbeite diesen Teil zuerst, dann leihst du die Kamera aus.</p></div><div class=\"where-box proto\"><span class=\"ic\">▤</span><div>Wärmebilder<p>Bearbeite diesen Teil zuerst. Danach planst du im Protokoll deine Aufnahmen und trägst dich in die Verleihliste für die Kamera ein.</p></div></div>"}, {"k": "info", "n": "3.1", "t": "Was misst eine Wärmebildkamera?", "h": "<div class=\"eyebrow\">Teil 3 · Info 1 von 3</div><h1>Was misst eine Wärmebildkamera?</h1><div class=\"text\"><p>Jeder Gegenstand sendet Infrarotstrahlung aus, und zwar umso mehr, je wärmer seine Oberfläche ist. Eine Wärmebildkamera misst diese Strahlung mit tausenden winzigen Messpunkten und rechnet sie in Oberflächentemperaturen um. Jede Temperatur bekommt eine Farbe. Die Skala am Bildrand zeigt, welche Farbe zu welcher Temperatur gehört. Die Kamera misst nur die Oberfläche: Was hinter der Wand passiert, sieht sie nicht direkt, sondern nur an der Wirkung auf die Oberfläche.</p></div>"}, {"k": "info", "n": "3.1", "t": "Wärmebrücken finden", "h": "<div class=\"eyebrow\">Teil 3 · Info 2 von 3</div><h1>Wärmebrücken finden</h1><div class=\"text\"><p>Fotografiert man ein Haus im Winter von außen, verraten warme Stellen, wo Wärme entweicht. Typische Schwachstellen sind Fenster und Rollladenkästen, Heizkörpernischen, Hausecken, Balkonplatten aus Beton und schlecht gedämmte Dachbereiche. Solche Stellen nennt man <b>Wärmebrücken</b>. Von innen ist es umgekehrt: Kalte Stellen an Außenwänden zeigen Wärmebrücken. Dort kann sich Feuchtigkeit niederschlagen und Schimmel bilden.</p></div><figure class=\"fig\"><img style=\"width:520px\" src=\"fig/thermo_altbau.jpg\" alt=\"Wärmebild eines ungedämmten Altbaus im Winter mit Messpunkten: Fenster und Wand gelb bis rot, Dach und Himmel blau bis violett\"><figcaption>Beispiel: ungedämmter Altbau im Winter, von außen. Die Kästchen sind Messpunkte in °C. Rund um die Fenster und an der Wand ist es deutlich wärmer (gelb, rot) als am Dach: Hier entweicht viel Wärme. Bild: Lutz Weidner, <a href=\"https://commons.wikimedia.org/wiki/File:Ungedaemmte_Aussenwand.jpg\" target=\"_blank\" rel=\"noopener\">Wikimedia Commons</a>, Lizenz <a href=\"https://creativecommons.org/licenses/by-sa/3.0/deed.de\" target=\"_blank\" rel=\"noopener\">CC BY-SA 3.0</a>, verkleinert</figcaption></figure>"}, {"k": "info", "n": "3.1", "t": "So gelingen gute Wärmebilder", "h": "<div class=\"eyebrow\">Teil 3 · Info 3 von 3</div><h1>So gelingen gute Wärmebilder</h1><div class=\"text\"><p>Außenaufnahmen gelingen nur bei kaltem Wetter: Innen und außen sollten mindestens 15 °C Unterschied sein, am besten morgens oder abends, wenn keine Sonne auf die Fassade scheint. Glas und glänzendes Metall spiegeln die Wärmestrahlung der Umgebung, deshalb sind Temperaturen auf Fensterscheiben oft falsch. Vergleiche Bilder nur, wenn sie dieselbe Farbskala haben. Fotografiere keine Personen und keine Hausnummern oder Namensschilder.</p></div>"}, {"k": "task", "n": "3.2", "t": "Ein Wärmebild auswerten", "h": "<div class=\"eyebrow\">Teil 3 · Aufgabe 3.2 <span class=\"tag mappe\">✎ Mappe</span></div><h1>Ein Wärmebild auswerten</h1><figure class=\"fig\"><img src=\"fig/thermo_passivhaus.png\" alt=\"Wärmebild: links ein Altbau mit gelb-grüner Fassade, rechts ein gedämmtes Haus mit blauer Fassade und helleren Fenstern; Farbskala rechts von 3 bis 9 °C\"><figcaption>Wärmebild im Winter: links ein Altbau, rechts ein gedämmtes Haus (Passivhaus). Bild: Passivhaus Institut, <a href=\"https://commons.wikimedia.org/wiki/File:Passivhaus_thermogram_gedaemmt_ungedaemmt.png\" target=\"_blank\" rel=\"noopener\">Wikimedia Commons</a>, Lizenz <a href=\"https://creativecommons.org/licenses/by-sa/3.0/deed.de\" target=\"_blank\" rel=\"noopener\">CC BY-SA 3.0</a></figcaption></figure><p class=\"task-q\">Draußen ist es etwa 0 °C, drinnen sind beide Häuser gleich warm geheizt.</p><ul class=\"bullets\" style=\"list-style:none;padding-left:0\"><li>a) Lies an der Farbskala ab, wie warm die Außenwand des Altbaus und die des gedämmten Hauses ungefähr sind.</li><li>b) Erkläre, warum ausgerechnet das gut gedämmte Haus die kältere Fassade hat.</li><li>c) Beim gedämmten Haus erscheinen die Fenster heller als die Wand. Beurteile, ob man daraus schließen kann, dass die Fenster schlecht dämmen.</li><li>d) Von innen fotografiert zeigt eine Zimmerecke an der Außenwand 12 °C, die übrige Wand 18 °C. Erläutere, welches Problem dort entstehen kann und warum.</li></ul><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Schreib deine Antworten in ganzen Sätzen in deine Mappe.</p></div></div><details class=\"tip\"><summary>Tipp 1</summary><div>a) Die Farbskala steht rechts am Bildrand. Blau bedeutet etwa 3 bis 4 °C, Grün etwa 5 bis 6 °C, Gelb etwa 7 °C.</div></details><details class=\"tip\"><summary>Tipp 2</summary><div>b) Die Kamera misst nur die Oberfläche. Überlege: Wie viel Wärme aus dem Inneren kommt bei einer guten Dämmung noch an der Außenseite an?</div></details><details class=\"tip\"><summary>Tipp 3</summary><div>c) Lies noch einmal die Info-Folie „So gelingen gute Wärmebilder“: Was passiert bei Glas? Und: Auch sehr gute Fenster dämmen weniger als eine dick gedämmte Wand.</div></details><details class=\"tip\"><summary>Tipp 4</summary><div>d) Denk an eine kalte Flasche aus dem Kühlschrank: Was passiert mit der feuchten Raumluft an einer kalten Oberfläche?</div></details><details class=\"tip\"><summary>Lösung anzeigen</summary><div class=\"sol\">a) Altbau: etwa 5 bis 7 °C (grün bis gelb). Gedämmtes Haus: etwa 3 bis 4 °C (blau), also fast so kalt wie die Außenluft.<br>b) Die Dämmung lässt kaum Wärme nach außen durch. Deshalb bleibt die Außenseite der Wand kalt. Beim Altbau dringt viel Wärme durch die Wand, die Fassade wird warm. Eine warme Fassade bedeutet also: Hier geht Wärme verloren.<br>c) Nur bedingt. Glas spiegelt die Wärmestrahlung der Umgebung, die Temperatur auf Scheiben ist deshalb oft falsch. Außerdem dämmt auch ein gutes Fenster weniger als eine dick gedämmte Wand. Die Fenster sind hier nur etwa 5 °C warm, das ist für Fenster wenig. Dass sie schlecht sind, kann man daraus nicht schließen.<br>d) Die Ecke ist eine Wärmebrücke. An der kalten Stelle kühlt die feuchte Raumluft ab, Wasser schlägt sich nieder (wie an einer kalten Flasche). Die Wand wird feucht, und dort kann sich Schimmel bilden.</div></details>"}, {"k": "task", "n": "3.3", "t": "Begründe, warum Außenaufnahmen bei Sonnenschein oder bei …", "h": "<div class=\"eyebrow\">Teil 3 · Aufgabe 3.3 <span class=\"tag mappe\">✎ Mappe</span></div><h1>Begründe, warum Außenaufnahmen bei Sonnenschein oder bei …</h1><p class=\"task-q\">Begründe, warum Außenaufnahmen bei Sonnenschein oder bei mildem Wetter wenig aussagekräftig sind.</p><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Bearbeite die Aufgabe in deiner Mappe.</p></div></div>"}, {"k": "switch", "t": "Jetzt ins Protokoll", "h": "<div class=\"eyebrow\">Teil 3 · Wechsel <span class=\"tag proto\">▤ Protokoll</span></div><h1>Jetzt arbeitest du im Protokoll weiter</h1><div class=\"where-box proto\"><span class=\"ic\">▤</span><div>Öffne dein Protokoll, Teil 3<p>Dort arbeitest du mit den Zahlen deiner eigenen Wohnung oder deines Hauses.</p></div></div><div class=\"card\"><ol class=\"bullets\"><li>Plane deine <b>Aufnahmen</b> und trag dich in die <b>Verleihliste</b> für die Wärmebildkamera ein.</li><li>Bearbeite die Aufgaben <b>3.1</b> bis <b>3.2</b>.</li></ol></div><div class=\"where-box mappe\"><span class=\"ic\">⌂</span><div>Hausaufgabe für die nächste Stunde<p>Finde zu Hause heraus, was du für Teil 4 brauchst. Hake ab, was du schon hast:</p><ul class=\"daten\"><li>Dachform, Dachneigung (schätzen oder mit einer Winkelmesser-App messen) und ungefähre Dachfläche</li><li>Ist das Dach bzw. die oberste Geschossdecke gedämmt? Material, Dicke, Alter</li><li>Die Himmelsrichtung von Balkon, Hauswänden oder Dachflächen (Aufgabe 4.1)</li><li>Gibt es schon eine Photovoltaik- oder Solarthermieanlage? Falls ja: Fläche, Leistung, Ertrag pro Jahr</li><li>Bei einer Wohnung: Gibt es einen Balkon oder eine Wand, an der Solarmodule hängen könnten? Ist dort Schatten?</li></ul></div></div><p class=\"small\">Klicke auf „Aufgabe erledigt“, wenn du Teil 3 im Protokoll fertig hast.</p>"}]}, {"id": "teil4", "short": "Teil 4", "title": "Dach und Sonnenstrom", "slides": [{"k": "info", "t": "Darum geht es", "h": "<div class=\"eyebrow\">Teil 4 · Dach und Sonnenstrom</div><h1>Darum geht es</h1><div class=\"text\"><p class=\"lead\">Über das Dach geht viel Wärme verloren, gleichzeitig kann es Strom liefern. Du lernst, wie man ein Dach dämmt, welche Dämmstoffe sich wofür eignen und wie du herausfindest, ob sich Solarmodule auf dem Dach oder am Balkon lohnen.</p></div><div class=\"where-box proto\"><span class=\"ic\">▤</span><div>Bevor du beginnst<p>Hake ab, welche Daten von zu Hause du schon hast. Was noch fehlt, notierst du als Hausaufgabe.</p><ul class=\"daten\"><li>Dachform, Dachneigung (schätzen oder mit einer Winkelmesser-App messen) und ungefähre Dachfläche</li><li>Ist das Dach bzw. die oberste Geschossdecke gedämmt? Material, Dicke, Alter</li><li>Die Himmelsrichtung von Balkon, Hauswänden oder Dachflächen (Aufgabe 4.1)</li><li>Gibt es schon eine Photovoltaik- oder Solarthermieanlage? Falls ja: Fläche, Leistung, Ertrag pro Jahr</li><li>Bei einer Wohnung: Gibt es einen Balkon oder eine Wand, an der Solarmodule hängen könnten? Ist dort Schatten?</li></ul></div></div>"}, {"k": "info", "n": "4.1", "t": "Dach oder oberste Geschossdecke dämmen?", "h": "<div class=\"eyebrow\">Teil 4 · Info 1 von 4</div><h1>Dach oder oberste Geschossdecke dämmen?</h1><div class=\"text\"><p>Ein Steildach wird von schrägen Holzbalken getragen, den <b>Sparren</b>. Wird der Dachboden bewohnt, dämmt man die Dachschräge. Am häufigsten liegt der Dämmstoff <b>zwischen den Sparren</b> (Zwischensparrendämmung). Wird das Dach ohnehin neu gedeckt, kann eine durchgehende Schicht <b>auf die Sparren</b> gelegt werden (Aufsparrendämmung). Das ist teurer, dämmt aber lückenlos, weil die Holzbalken keine Wärmebrücken mehr bilden. Eine zusätzliche Schicht <b>unter den Sparren</b> verbessert eine vorhandene Dämmung von innen.</p></div><figure class=\"fig\"><img src=\"fig/dach.png\" alt=\"Drei Arten, eine Dachschräge zu dämmen (Querschnitt, schematisch)\" loading=\"lazy\"><figcaption>Drei Arten, eine Dachschräge zu dämmen (Querschnitt, schematisch)</figcaption></figure><div class=\"text\"><p>Wird der Dachboden nicht bewohnt, muss nicht das ganze Dach gedämmt werden. Es genügt, die <b>oberste Geschossdecke</b> zu dämmen, also den Fußboden des Dachbodens. Die Wärme bleibt dann in der Wohnung darunter, und der Dachboden bleibt kalt. Das ist die günstigste Dämmmaßnahme überhaupt.</p></div><figure class=\"fig\"><img src=\"fig/geschossdecke.png\" alt=\"geschossdecke\" loading=\"lazy\"></figure>"}, {"k": "info", "n": "4.1", "t": "Welcher Dämmstoff fürs Dach?", "h": "<div class=\"eyebrow\">Teil 4 · Info 2 von 4</div><h1>Welcher Dämmstoff fürs Dach?</h1><div class=\"text\"><p>Es gibt keinen „besten“ Dämmstoff, man muss abwägen. <b>Mineralwolle</b> ist günstig und brennt nicht, kratzt aber bei der Verarbeitung. <b>Hartschaum (PUR/PIR)</b> dämmt bei gleicher Dicke am besten, ist aber aus Erdöl hergestellt und schwer zu recyceln. <b>Holzfaser</b> und <b>Zellulose</b> (aus Altpapier) sind nachwachsend bzw. recycelt und speichern Wärme etwas besser, was im Sommer die Hitze unter dem Dach leicht verzögert; sie sind aber teurer bzw. brauchen mehr Dicke. Wichtig ist außerdem eine dichte Folie auf der Innenseite (Dampfbremse), damit keine feuchte Raumluft in die Dämmung zieht.</p><p>Erinnerung: λ ist die Wärmeleitfähigkeit aus Teil 2. Je kleiner λ, desto besser dämmt der Stoff.</p></div><div class=\"card tbl\"><table><thead><tr><th>Dämmstoff</th><th>λ in W/(m·K)</th><th>brennbar?</th><th>Herkunft</th></tr></thead><tbody><tr><td>Mineralwolle</td><td>0,032–0,040</td><td>nein</td><td>Gestein, Altglas</td></tr><tr><td>PUR/PIR-Hartschaum</td><td>0,022–0,028</td><td>schwer entflammbar</td><td>Erdöl</td></tr><tr><td>Holzfaser</td><td>0,038–0,052</td><td>ja (normal entflammbar)</td><td>Holzreste</td></tr><tr><td>Zellulose</td><td>0,038–0,045</td><td>schwer bzw. normal entflammbar</td><td>Altpapier</td></tr></tbody></table></div><div class=\"card steck\"><h2>Steckbrief: oberste Geschossdecke dämmen</h2><dl><dt>Kosten (ca.)</dt><dd>20 bis 35 € pro m² (nicht begehbar), 40 bis 80 € (begehbar)</dd><dt>Einsparung</dt><dd>etwa 7 % der Heizenergie</dd><dt>CO₂</dt><dd>Beispielhaus mit Gas: etwa 0,25 t pro Jahr</dd><dt>Lohnt sich nach</dt><dd>oft schon nach 2 bis 6 Jahren</dd></dl></div><div class=\"card steck\"><h2>Steckbrief: Dachschräge dämmen</h2><dl><dt>Kosten (ca.)</dt><dd>Zwischensparren 70 bis 120 € pro m², Aufsparren 130 bis 200 € pro m²</dd><dt>Einsparung</dt><dd>etwa 13 % der Heizenergie</dd><dt>CO₂</dt><dd>Beispielhaus mit Gas: etwa 0,5 t pro Jahr</dd><dt>Lohnt sich nach</dt><dd>stark abhängig von Dach und Zustand</dd></dl></div><div class=\"text\"><p class=\"small\">(Quellen der Steckbriefe: co2online, 42watt (gerundet). Beispielhaus: 15 000 kWh Heizwärme mit Erdgas.)</p></div>"}, {"k": "info", "n": "4.1", "t": "Strom von der Sonne: Was du schon weißt", "h": "<div class=\"eyebrow\">Teil 4 · Info 3 von 4</div><h1>Strom von der Sonne: Was du schon weißt</h1><div class=\"text\"><p>Aus dem Unterricht kennst du die Solarzelle: Sie wandelt Licht direkt in elektrische Energie um. Im „Digitalen Solar-Labor“ hast du mit PVGIS untersucht, wie Ausrichtung und Neigung den Ertrag verändern. Darauf baust du jetzt auf. Für dein Gutachten kommen drei Fragen dazu:</p><p><b>Eigenverbrauch oder Einspeisung?</b> Solarstrom spart vor allem dann Geld, wenn man ihn selbst verbraucht, denn dann muss man keinen Strom für etwa 0,35 € pro kWh kaufen. Für Strom, der ins Netz fließt, gibt es bei Dachanlagen nur eine kleine Vergütung (wenige Cent), beim Balkonkraftwerk meist gar nichts. Weil die Sonne mittags scheint, viele aber abends Strom brauchen, nutzt ein Haushalt ohne Speicher meist nur etwa die Hälfte selbst. Mit einem <b>Batteriespeicher</b> steigt der Eigenverbrauch, der Speicher kostet aber zusätzlich und hat eine begrenzte Lebensdauer.</p><p><b>Wechselrichter und Schatten:</b> Solarmodule liefern Gleichstrom, im Haus wird Wechselstrom gebraucht. Das erledigt der Wechselrichter. Weil die Zellen eines Moduls hintereinandergeschaltet sind, kann schon der Schatten eines Baums oder Balkons den Ertrag eines ganzen Moduls stark senken.</p><p><b>Balkonkraftwerke:</b> Ein Balkonkraftwerk besteht meist aus zwei Modulen und einem kleinen Wechselrichter, der in die Steckdose gesteckt wird. Erlaubt sind 800 W Wechselrichterleistung. Mieterinnen und Mieter brauchen die Zustimmung des Vermieters, der sie seit Oktober 2024 aber nur noch in Ausnahmefällen verweigern darf (Verbraucherzentrale).</p></div><div class=\"card steck\"><h2>Steckbrief: Balkonkraftwerk (800 W)</h2><dl><dt>Kosten (ca.)</dt><dd>etwa 450 € mit Halterung</dd><dt>Einsparung</dt><dd>je nach Ausrichtung 400 bis 700 kWh pro Jahr, davon ca. die Hälfte selbst genutzt</dd><dt>CO₂</dt><dd>etwa 0,1 t pro Jahr</dd><dt>Lohnt sich nach</dt><dd>meist nach 4 bis 8 Jahren</dd></dl></div>"}, {"k": "info", "n": "4.1", "t": "Himmelsrichtung, Kompass und Azimut", "h": "<div class=\"eyebrow\">Teil 4 · Info 4 von 4</div><h1>Himmelsrichtung, Kompass und Azimut</h1><div class=\"text\"><p>Wie viel Strom ein Modul liefert, hängt stark davon ab, wohin es zeigt. Die Richtung gibt man als Winkel in der Waagerechten an, den <b>Azimut</b>. Das Wort kommt aus dem Arabischen: as-sumūt bedeutet „die Richtungen“ oder „die Wege“. Arabische Astronomen haben damit im Mittelalter die Richtung von Sternen beschrieben. Achtung, es gibt zwei Zählweisen: Der <b>Kompass</b> zählt ab Norden im Uhrzeigersinn (Osten 90°, Süden 180°, Westen 270°). <b>PVGIS</b> zählt ab Süden: Süden 0°, Westen +90°, Osten −90°, Norden ±180°. Umrechnung: <b>Azimut = Kompass − 180°</b>.</p></div><figure class=\"fig\"><img src=\"fig/windrose.png\" alt=\"Außen: Kompass-Grad. Innen: Azimut für PVGIS. Die Übung „Solar-Helfer“ zeigt dir beides für jede Richtung.\" loading=\"lazy\"><figcaption>Außen: Kompass-Grad. Innen: Azimut für PVGIS. Die Übung „Solar-Helfer“ zeigt dir beides für jede Richtung.</figcaption></figure><div class=\"text\"><p>Die Himmelsrichtung deiner Wohnung bestimmst du im Protokoll mit einer Kompass-App. Eine kostenlose App ohne Werbung, die keine Daten sammelt, ist „Compass“ von Philipp Bobek (Android, im Store danach suchen). Auf dem iPhone ist die App „Kompass“ schon installiert.</p></div>"}, {"k": "task", "n": "4.2", "t": "Erkläre, warum bei einem unbewohnten Dachboden die …", "h": "<div class=\"eyebrow\">Teil 4 · Aufgabe 4.2 <span class=\"tag mappe\">✎ Mappe</span> <span class=\"tag star\">★ freiwillig</span></div><h1>Erkläre, warum bei einem unbewohnten Dachboden die …</h1><p class=\"task-q\">Erkläre, warum bei einem unbewohnten Dachboden die Dämmung der obersten Geschossdecke genügt, und nenne zwei Vorteile gegenüber einer Dämmung der Dachschräge.</p><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Bearbeite die Aufgabe in deiner Mappe.</p></div></div>", "star": true}, {"k": "task", "n": "4.3", "t": "Familie B", "h": "<div class=\"eyebrow\">Teil 4 · Aufgabe 4.3 <span class=\"tag mappe\">✎ Mappe</span> <span class=\"tag star\">★ freiwillig</span></div><h1>Familie B</h1><p class=\"task-q\">Familie B. baut den Dachboden zu einem Kinderzimmer aus. Im Sommer soll es dort nicht zu heiß werden, die Familie achtet auf Umweltverträglichkeit, das Geld ist aber knapp. Beurteile, welchen Dämmstoff du empfiehlst. Wäge dabei mindestens drei Gesichtspunkte ab.</p><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Bearbeite die Aufgabe in deiner Mappe.</p></div></div>", "star": true}, {"k": "task", "n": "4.4", "t": "Übung: Solar-Helfer", "h": "<div class=\"eyebrow\">Teil 4 · Aufgabe 4.4 <span class=\"tag screen\">● hier am Bildschirm</span> <span class=\"tag mappe\">✎ Mappe</span></div><h1>Übung: Solar-Helfer</h1><p class=\"task-q\">Ein Balkon zeigt laut Kompass-App nach 240°.</p><ul class=\"bullets\" style=\"list-style:none;padding-left:0\"><li>a) Stelle 240° im Solar-Helfer ein (Zahl eingeben oder in die Windrose klicken). Notiere Himmelsrichtung und Azimut für PVGIS.</li><li>b) Prüfe die Umrechnung mit der Formel aus dem Info-Kasten.</li><li>c) Beurteile, ob der Balkon für ein Balkonkraftwerk geeignet ist.</li></ul><div class=\"tool-frame\"><iframe src=\"tools/solar-helfer.html\" title=\"Solar-Helfer\" loading=\"lazy\"></iframe></div><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Schreib den Rechenweg und die Ergebnisse mit Einheit in deine Mappe. Hier kannst du sie danach prüfen.</p></div></div><details class=\"tip\"><summary>Tipp 1</summary><div>240° liegt zwischen Süden (180°) und Westen (270°), also Südwest.</div></details><details class=\"tip\"><summary>Tipp 2</summary><div>Für PVGIS rechnest du: 240° minus 180° = 60°.</div></details><div class=\"card\"><h2>Ergebnis prüfen</h2><div class=\"check\"><label for=\"c4_4_0\">Azimut für PVGIS<input id=\"c4_4_0\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"°\"></label><button class=\"btn\" data-check=\"c4_4\">Prüfen</button></div><div class=\"fb\" id=\"c4_4_fb\" hidden></div><details class=\"tip\"><summary>Lösung anzeigen</summary><div class=\"sol\">240° ist <b>Südwest</b>. Azimut: 240° − 180° = <b>60°</b>. Südwest ist gut geeignet: Der Balkon bekommt viel Nachmittagssonne.</div></details></div>"}, {"k": "task", "n": "4.5", "t": "Übe mit dem Solarrechner PVGIS am Beispiel dieses …", "h": "<div class=\"eyebrow\">Teil 4 · Aufgabe 4.5 <span class=\"tag mappe\">✎ Mappe</span></div><h1>Übe mit dem Solarrechner PVGIS am Beispiel dieses …</h1><p class=\"task-q\">Übe mit dem Solarrechner <a href=\"https://re.jrc.ec.europa.eu/pvg_tools/de/\" target=\"_blank\" rel=\"noopener\">PVGIS</a> am Beispiel dieses Balkons in Kiel. Gehe vor wie im „Digitalen Solar-Labor“.</p><ul class=\"bullets\" style=\"list-style:none;padding-left:0\"><li>a) Klicke auf der Karte auf Kiel und wähle „Netzgekoppelt“.</li><li>b) Trage ein: Leistung 0,8 kWp, Neigung 90° (Module senkrecht am Geländer), Azimut aus der vorigen Aufgabe. Entferne den Haken bei „Optimieren“.</li><li>c) Lies den Jahresertrag in kWh ab und vergleiche ihn mit der Schätzung des Solar-Helfers.</li><li>d) Berechne die Ersparnis pro Jahr (die Hälfte des Stroms wird selbst genutzt, 0,35 € pro kWh) und die Amortisationszeit bei 450 € Kosten.</li></ul><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Bearbeite die Aufgabe in deiner Mappe.</p></div></div><details class=\"tip\"><summary>Tipp 1</summary><div>Beispiel, falls PVGIS 500 kWh liefert: Die Hälfte nutzt der Haushalt selbst, also 250 kWh. 250 kWh · 0,35 € = 87,50 € Ersparnis pro Jahr.</div></details><details class=\"tip\"><summary>Tipp 2</summary><div>Amortisation im Beispiel: 450 € : 87,50 € ≈ 5,1 Jahre. Rechne genauso mit deinem Wert aus PVGIS.</div></details>"}, {"k": "switch", "t": "Jetzt ins Protokoll", "h": "<div class=\"eyebrow\">Teil 4 · Wechsel <span class=\"tag proto\">▤ Protokoll</span></div><h1>Jetzt arbeitest du im Protokoll weiter</h1><div class=\"where-box proto\"><span class=\"ic\">▤</span><div>Öffne dein Protokoll, Teil 4<p>Dort arbeitest du mit den Zahlen deiner eigenen Wohnung oder deines Hauses.</p></div></div><div class=\"card\"><ol class=\"bullets\"><li>Trag die <b>Daten</b> ein, die du zu Hause erhoben hast.</li><li>Bearbeite die Aufgaben <b>4.1</b> bis <b>4.3</b>.</li><li>Schreib unter <b>Für dein Gutachten</b> deine Stichpunkte.</li></ol></div><div class=\"where-box mappe\"><span class=\"ic\">⌂</span><div>Hausaufgabe für die nächste Stunde<p>Finde zu Hause heraus, was du für Teil 5 brauchst. Hake ab, was du schon hast:</p><ul class=\"daten\"><li>Anzahl der Fenster, ungefähre Größe und Himmelsrichtung, Alter und Rahmenmaterial</li><li><b>Feuerzeugtest:</b> Halte eine Feuerzeugflamme vor die Scheibe. Jede Glasscheibe spiegelt die Flamme einmal, so zählst du die Scheiben. Hat ein Spiegelbild eine andere Farbe, hat das Glas eine Wärmeschutzschicht. Bitte nur mit Erlaubnis deiner Eltern und nicht in der Nähe von Vorhängen.</li><li><b>Papiertest:</b> Klemm ein Blatt Papier ins Fenster und schließ es. Lässt sich das Blatt leicht herausziehen, ist die Dichtung undicht.</li><li>Rollläden vorhanden? Haustür: Material, schließt sie dicht?</li></ul></div></div><p class=\"small\">Klicke auf „Aufgabe erledigt“, wenn du Teil 4 im Protokoll fertig hast.</p>"}]}, {"id": "teil5", "short": "Teil 5", "title": "Fenster und Türen", "slides": [{"k": "info", "t": "Darum geht es", "h": "<div class=\"eyebrow\">Teil 5 · Fenster und Türen</div><h1>Darum geht es</h1><div class=\"text\"><p class=\"lead\">Fenster sind die „Löcher“ in der warmen Hülle eines Hauses. Du lernst, woran man gute Fenster erkennt, wie man ihren Wärmeverlust berechnet und was man auch als Mieterin oder Mieter tun kann.</p></div><div class=\"where-box proto\"><span class=\"ic\">▤</span><div>Bevor du beginnst<p>Hake ab, welche Daten von zu Hause du schon hast. Was noch fehlt, notierst du als Hausaufgabe.</p><ul class=\"daten\"><li>Anzahl der Fenster, ungefähre Größe und Himmelsrichtung, Alter und Rahmenmaterial</li><li><b>Feuerzeugtest:</b> Halte eine Feuerzeugflamme vor die Scheibe. Jede Glasscheibe spiegelt die Flamme einmal, so zählst du die Scheiben. Hat ein Spiegelbild eine andere Farbe, hat das Glas eine Wärmeschutzschicht. Bitte nur mit Erlaubnis deiner Eltern und nicht in der Nähe von Vorhängen.</li><li><b>Papiertest:</b> Klemm ein Blatt Papier ins Fenster und schließ es. Lässt sich das Blatt leicht herausziehen, ist die Dichtung undicht.</li><li>Rollläden vorhanden? Haustür: Material, schließt sie dicht?</li></ul></div></div>"}, {"k": "info", "n": "5.1", "t": "Ein Viertel der Wärme", "h": "<div class=\"eyebrow\">Teil 5 · Info 1 von 4</div><h1>Ein Viertel der Wärme</h1><div class=\"text\"><p>Im Beispielhaus aus Teil 2 gehen etwa 25 % der verlorenen Wärme durch Fenster und Türen, obwohl sie nur einen kleinen Teil der Außenfläche ausmachen. Glas leitet Wärme viel besser als eine Wand, und an undichten Fugen strömt warme Luft hinaus.</p></div>"}, {"k": "info", "n": "5.1", "t": "Wie ist ein modernes Fenster aufgebaut?", "h": "<div class=\"eyebrow\">Teil 5 · Info 2 von 4</div><h1>Wie ist ein modernes Fenster aufgebaut?</h1><div class=\"text\"><p>Ein <b>Einfachfenster</b> hat nur eine Glasscheibe. Beim <b>Zweifach-</b> und <b>Dreifachglas</b> liegen zwischen den Scheiben dünne Zwischenräume, die mit einem Edelgas wie Argon gefüllt sind. Das Gas leitet Wärme noch schlechter als Luft. Bei Wärmeschutzglas ist außerdem eine hauchdünne, unsichtbare Metallschicht aufgedampft. Sie lässt Licht hinein, wirft aber die Wärmestrahlung aus dem Raum zurück. Auch Rahmen (Holz, Kunststoff, Aluminium) und Dichtungen beeinflussen, wie viel Wärme verloren geht. Fenster und Haustür müssen dicht schließen, sonst zieht kalte Luft herein.</p></div>"}, {"k": "info", "n": "5.1", "t": "Der U-Wert", "h": "<div class=\"eyebrow\">Teil 5 · Info 3 von 4</div><h1>Der U-Wert</h1><div class=\"text\"><p>Wie viel Wärme ein Bauteil durchlässt, gibt der U-Wert an: Er sagt, wie viel Watt durch 1 m² fließen, wenn der Temperaturunterschied 1 K beträgt (1 K = 1 °C Unterschied). Je kleiner der U-Wert, desto besser. Es gilt: <b>Wärmeverlust-Leistung (W) = U-Wert · Fläche (m²) · Temperaturunterschied (K)</b>. Die Grafik zeigt eine Beispielrechnung für ein Einfachfenster:</p></div><figure class=\"fig\"><img src=\"fig/fenster.png\" alt=\"fenster\" loading=\"lazy\"></figure><div class=\"card tbl\"><table><thead><tr><th>Verglasung</th><th>U-Wert in W/(m²·K), gerundet</th></tr></thead><tbody><tr><td>Einfachglas</td><td>5,8</td></tr><tr><td>altes Isolierglas (zweifach, ohne Beschichtung)</td><td>2,8</td></tr><tr><td>Wärmeschutzglas zweifach</td><td>1,1</td></tr><tr><td>Wärmeschutzglas dreifach</td><td>0,6</td></tr></tbody></table></div>"}, {"k": "info", "n": "5.1", "t": "Prüfen und verbessern", "h": "<div class=\"eyebrow\">Teil 5 · Info 4 von 4</div><h1>Prüfen und verbessern</h1><div class=\"text\"><p><b>Feuerzeugtest (Umweltbundesamt):</b> Hält man eine Flamme vor die Scheibe, spiegelt jede Glasscheibe die Flamme einmal. So zählt man die Scheiben. Hat ein Spiegelbild eine andere Farbe, ist eine Wärmeschutzschicht aufgedampft. <b>Papiertest:</b> Lässt sich ein eingeklemmtes Blatt Papier bei geschlossenem Fenster leicht herausziehen, ist die Dichtung undicht. <b>Auch ohne neue Fenster</b> kann man viel tun: Dichtungen erneuern (wenige Euro pro Fenster), nachts Rollläden schließen (spart etwa 20 % der Verluste am Fenster) und Vorhänge nicht vor Heizkörper hängen.</p></div><div class=\"card steck\"><h2>Steckbrief: neues Fenster (Wärmeschutzglas dreifach)</h2><dl><dt>Kosten (ca.)</dt><dd>je nach Größe grob 600 bis 1 500 € pro Fenster, eingebaut</dd><dt>Einsparung</dt><dd>gegenüber Einfachglas etwa 90 % weniger Verlust am Fenster</dd><dt>CO₂</dt><dd>siehe Aufgabe</dd><dt>Lohnt sich nach</dt><dd>lohnt sich vor allem bei sehr alten Fenstern</dd></dl></div>"}, {"k": "task", "n": "5.2", "t": "Berechne mit der Formel aus dem Info-Kasten, wie viel …", "h": "<div class=\"eyebrow\">Teil 5 · Aufgabe 5.2 <span class=\"tag mappe\">✎ Mappe</span> <span class=\"tag star\">★ freiwillig</span></div><h1>Berechne mit der Formel aus dem Info-Kasten, wie viel …</h1><p class=\"task-q\">Berechne mit der Formel aus dem Info-Kasten, wie viel Wärme ein 2 m² großes Fenster mit Dreifach-Wärmeschutzglas verliert. Gehe Schritt für Schritt vor wie in der Grafik (mittlerer Temperaturunterschied 12 K, Heizzeit 5 000 h, Erdgas 0,12 € pro kWh).</p><ul class=\"bullets\" style=\"list-style:none;padding-left:0\"><li>a) Wärmeverlust-Leistung in W</li><li>b) Energieverlust im Winter in kWh</li><li>c) Heizkosten pro Jahr in €</li><li>d) Ersparnis gegenüber dem Einfachfenster aus der Grafik in € pro Jahr</li><li>e) Das neue Fenster kostet 900 €. Berechne die Amortisationszeit und beurteile, ob sich der Tausch nur wegen der Heizkosten lohnt.</li></ul><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Schreib den Rechenweg und die Ergebnisse mit Einheit in deine Mappe. Hier kannst du sie danach prüfen.</p></div></div><details class=\"tip\"><summary>Tipp 1</summary><div>a) Mach es wie in der Grafik, nur mit dem U-Wert von Dreifachglas aus der Tabelle: 0,6 · 2 · 12 = … W.</div></details><details class=\"tip\"><summary>Tipp 2</summary><div>b) Das Ergebnis aus a) mal 5 000 Stunden ergibt Wattstunden. Durch 1 000 geteilt sind es kWh. c) kWh mal 0,12 €.</div></details><details class=\"tip\"><summary>Tipp 3</summary><div>d) Das Einfachfenster kostet laut Grafik etwa 83 € im Jahr. Zieh deine Kosten aus c) davon ab. e) 900 € geteilt durch die Ersparnis aus d).</div></details><div class=\"card\"><h2>Ergebnis prüfen</h2><div class=\"check\"><label for=\"c5_2_0\">a) Leistung<input id=\"c5_2_0\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"W\"></label><label for=\"c5_2_1\">b) Energie<input id=\"c5_2_1\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"kWh\"></label><label for=\"c5_2_2\">c) Kosten<input id=\"c5_2_2\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"€\"></label><label for=\"c5_2_3\">d) Ersparnis<input id=\"c5_2_3\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"€\"></label><label for=\"c5_2_4\">e) Amortisationszeit<input id=\"c5_2_4\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"Jahre\"></label><button class=\"btn\" data-check=\"c5_2\">Prüfen</button></div><div class=\"fb\" id=\"c5_2_fb\" hidden></div><details class=\"tip\"><summary>Lösung anzeigen</summary><div class=\"sol\">a) 0,6 · 2 · 12 = <b>14,4 W</b><br>b) 14,4 W · 5 000 h = 72 000 Wh = <b>72 kWh</b><br>c) 72 kWh · 0,12 € ≈ <b>8,64 €</b><br>d) 83,40 € − 8,64 € ≈ <b>75 € pro Jahr</b><br>e) 900 € : 75 € ≈ <b>12 Jahre</b>. Nur wegen der Heizkosten lohnt sich der Tausch kaum. Dazu kommen aber weniger Zugluft und mehr Behaglichkeit.</div></details></div>", "star": true}, {"k": "switch", "t": "Jetzt ins Protokoll", "h": "<div class=\"eyebrow\">Teil 5 · Wechsel <span class=\"tag proto\">▤ Protokoll</span></div><h1>Jetzt arbeitest du im Protokoll weiter</h1><div class=\"where-box proto\"><span class=\"ic\">▤</span><div>Öffne dein Protokoll, Teil 5<p>Dort arbeitest du mit den Zahlen deiner eigenen Wohnung oder deines Hauses.</p></div></div><div class=\"card\"><ol class=\"bullets\"><li>Trag die <b>Daten</b> ein, die du zu Hause erhoben hast.</li><li>Bearbeite <b>Aufgabe 5.1</b>.</li><li>Schreib unter <b>Für dein Gutachten</b> deine Stichpunkte.</li></ol></div><div class=\"where-box mappe\"><span class=\"ic\">⌂</span><div>Hausaufgabe für die nächste Stunde<p>Finde zu Hause heraus, was du für Teil 6 brauchst. Hake ab, was du schon hast:</p><ul class=\"daten\"><li>Art und Alter der Heizung (Typenschild am Heizkessel bzw. an der Fernwärmestation oder Eltern fragen), Anzahl der Heizkörper, Fußbodenheizung</li><li>Raumtemperaturen in Wohnzimmer, Küche und Schlafzimmer messen. Wie wird im Winter gelüftet?</li><li>Warmwasser: Wie wird es erwärmt (über die Heizung, Durchlauferhitzer, Boiler)? Sind die Rohre gedämmt?</li><li><b>Deine Dusche:</b> Stopp die Dauer einer typischen Dusche. <b>Eimer-Methode:</b> Halte einen Eimer 10 Sekunden unter die voll aufgedrehte Dusche, miss die Liter (Messbecher) und nimm sie mal 6. Das ergibt die Liter pro Minute. Kein Messbecher zu Hause? Leih dir einen bei Herrn Kuprat.</li></ul></div></div><p class=\"small\">Klicke auf „Aufgabe erledigt“, wenn du Teil 5 im Protokoll fertig hast.</p>"}]}, {"id": "teil6", "short": "Teil 6", "title": "Heizung und Warmwasser", "slides": [{"k": "info", "t": "Darum geht es", "h": "<div class=\"eyebrow\">Teil 6 · Heizung und Warmwasser</div><h1>Darum geht es</h1><div class=\"text\"><p class=\"lead\">Heizung und Warmwasser machen den größten Teil des Energieverbrauchs eines Haushalts aus. Du lernst die wichtigsten Heizungsarten kennen, erfährst, wie Kiel mit Fernwärme heizt, wie eine Wärmepumpe funktioniert und wie viel Energie beim Duschen steckt. Dieser Teil ist der größte, plane etwa drei Stunden ein.</p></div><div class=\"where-box proto\"><span class=\"ic\">▤</span><div>Bevor du beginnst<p>Hake ab, welche Daten von zu Hause du schon hast. Was noch fehlt, notierst du als Hausaufgabe.</p><ul class=\"daten\"><li>Art und Alter der Heizung (Typenschild am Heizkessel bzw. an der Fernwärmestation oder Eltern fragen), Anzahl der Heizkörper, Fußbodenheizung</li><li>Raumtemperaturen in Wohnzimmer, Küche und Schlafzimmer messen. Wie wird im Winter gelüftet?</li><li>Warmwasser: Wie wird es erwärmt (über die Heizung, Durchlauferhitzer, Boiler)? Sind die Rohre gedämmt?</li><li><b>Deine Dusche:</b> Stopp die Dauer einer typischen Dusche. <b>Eimer-Methode:</b> Halte einen Eimer 10 Sekunden unter die voll aufgedrehte Dusche, miss die Liter (Messbecher) und nimm sie mal 6. Das ergibt die Liter pro Minute. Kein Messbecher zu Hause? Leih dir einen bei Herrn Kuprat.</li></ul></div></div>"}, {"k": "info", "n": "6.1", "t": "Heizungsarten", "h": "<div class=\"eyebrow\">Teil 6 · Info 1 von 6</div><h1>Heizungsarten</h1><div class=\"text\"><p>Die meisten Wohnungen in Deutschland werden noch mit Erdgas oder Heizöl beheizt. Dabei wird ein Brennstoff verbrannt, und es entsteht CO₂. Erdgas besteht vor allem aus Methan: CH₄ + 2 O₂ → CO₂ + 2 H₂O. Pro kWh Wärme entstehen bei einer Gasheizung etwa 0,24 kg CO₂: im Brenner selbst etwa 0,20 kg, dazu kommen Förderung, Transport und die Verluste der Heizung. Klimafreundlicher sind Wärmepumpen, Fernwärme aus erneuerbaren Quellen oder Abwärme und, mit Einschränkungen, Holzpellets. Seit 2024 gilt: Neu eingebaute Heizungen müssen nach und nach mindestens 65 % erneuerbare Energie nutzen. In Kiel gilt das ab Mitte 2026.</p></div>"}, {"k": "info", "n": "6.1", "t": "Fernwärme in Kiel", "h": "<div class=\"eyebrow\">Teil 6 · Info 2 von 6</div><h1>Fernwärme in Kiel</h1><div class=\"text\"><p>Viele Kieler Wohnungen, auch in der Nähe unserer Schule, heizen mit <b>Fernwärme</b>: Heißes Wasser wird in Kraftwerken erhitzt und durch gut gedämmte Rohre unter den Straßen zu den Häusern gepumpt. Dort gibt es seine Wärme über einen Wärmetauscher an die Heizung ab und fließt abgekühlt zurück. Das Kieler Fernwärmenetz ist rund 374 km lang, eines der größten in Deutschland.</p></div><figure class=\"fig\"><img src=\"fig/fernwaerme.png\" alt=\"So kommt die Fernwärme in Kiel zu den Wohnungen (vereinfacht; Angaben: BDEW, ZfK, Stadtwerke Kiel)\" loading=\"lazy\"><figcaption>So kommt die Fernwärme in Kiel zu den Wohnungen (vereinfacht; Angaben: BDEW, ZfK, Stadtwerke Kiel)</figcaption></figure><div class=\"text\"><p>Herzstück ist seit 2019 das <b>Küstenkraftwerk</b> der Stadtwerke Kiel am Ostufer. Es ersetzt das alte Kohlekraftwerk. 20 große Gasmotoren erzeugen gleichzeitig Strom und Wärme. Das nennt man <b>Kraft-Wärme-Kopplung (KWK)</b>: Die Abwärme, die in einem normalen Kraftwerk ungenutzt verloren geht, heizt hier Wohnungen. So werden über 90 % der Energie des Erdgases genutzt. Auf dem Kraftwerksgelände steht außerdem ein 60 m hoher <b>Wärmespeicher</b>. Er fasst rund 30 000 m³ bis zu 115 °C heißes Wasser, also über 1 500 MWh Wärme. Damit könnte er etwa 70 000 Kunden bis zu 8 Stunden lang allein mit Wärme versorgen. Weht viel Wind und ist Strom im Überfluss da, macht ein <b>Elektrodenkessel</b> daraus Wärme für das Netz. Auch das kleinere Heizkraftwerk in der Humboldtstraße am Schrevenpark liefert Fernwärme. Die <b>Müllverbrennungsanlage</b> am Theodor-Heuss-Ring liefert das ganze Jahr über die Grundlast: im Sommer etwa 14 MW, im Winter etwa 28 MW Wärme. Gebaut wurde das Küstenkraftwerk für rund 290 Millionen €, den größten Teil davon (105 Millionen €) lieh die Europäische Investitionsbank. Bezahlt wird das am Ende über die Preise, die die Kunden für Wärme und Strom zahlen.</p></div><figure class=\"fig\"><img src=\"fig/kwk.png\" alt=\"kwk\" loading=\"lazy\"></figure><div class=\"text\"><p>Noch stammt die Kieler Fernwärme überwiegend aus Erdgas. Bis 2045 muss sie klimaneutral werden. Die Stadtwerke planen dafür große Wärmepumpen, die dem Wasser der Förde Wärme entziehen, Wärme aus tiefen Erdschichten und später Wasserstoff. Die Stadt hat 2024 einen <b>Wärmeplan</b> beschlossen: Er legt fest, in welchen Straßen das Fernwärmenetz wachsen soll. Übrigens: Abwärme lässt sich auch anders nutzen. Um 2010 lag am Ostufer eine Forellenzucht im Bereich des warmen Kühlwassers des damaligen Kohlekraftwerks; Forscher maßen dort bis zu 2 °C wärmeres Wasser als in der übrigen Förde.</p></div>"}, {"k": "info", "n": "6.1", "t": "Die Wärmepumpe", "h": "<div class=\"eyebrow\">Teil 6 · Info 3 von 6</div><h1>Die Wärmepumpe</h1><div class=\"text\"><p>Ein Kühlschrank pumpt Wärme aus seinem Inneren nach außen, deshalb ist er innen kalt und hinten warm. Eine Wärmepumpe macht dasselbe umgekehrt: Sie holt Wärme aus der kalten Umgebung (Außenluft, Erdreich oder Grundwasser) und pumpt sie mit Hilfe von Strom ins Haus. Möglich macht das ein Kältemittel, das in einem Kreislauf umläuft:</p></div><figure class=\"fig\"><img src=\"fig/wp_wiki2.png\" alt=\"Der Kreislauf in einer Wärmepumpe (Quelle: Wikimedia Commons, verändert)\" loading=\"lazy\"><figcaption>Der Kreislauf in einer Wärmepumpe (Quelle: Wikimedia Commons, verändert)</figcaption></figure><div class=\"text\"><p>Die <b>Jahresarbeitszahl (JAZ)</b> gibt an, wie viele kWh Wärme die Pumpe im Jahresmittel aus 1 kWh Strom macht. Auf beiden Seiten steht eine Energie, deshalb hat die JAZ keine Einheit. Gute Anlagen erreichen 4 oder mehr (Umweltbundesamt): Aus 1 kWh Strom werden 4 kWh Wärme, die übrigen 3 kWh kommen kostenlos aus der Umwelt.</p></div><figure class=\"fig\"><img src=\"fig/jaz.png\" alt=\"jaz\" loading=\"lazy\"></figure><div class=\"text\"><p>Beispiel: Ein Haus braucht 12 000 kWh Wärme pro Jahr. Mit JAZ 4 braucht die Wärmepumpe 12 000 kWh : 4 = 3 000 kWh Strom. <b>Luftwärmepumpen</b> sind am häufigsten, weil sie günstig einzubauen sind. Effizienter ist <b>oberflächennahe Geothermie</b>: Erdsonden (Bohrungen bis etwa 100 m, höchstens rund 400 m tief) oder Flächenkollektoren im Garten holen Erdwärme, denn der Boden ist auch im Winter etwa 8 bis 12 °C warm. Davon zu unterscheiden ist die <b>tiefe Geothermie</b>, bei der heißes Wasser aus mehreren Kilometern Tiefe direkt heizt oder Strom erzeugt. Eine Wärmepumpe arbeitet umso besser, je niedriger die Vorlauftemperatur des Heizwassers ist. Ideal ist eine Fußbodenheizung (35 °C oder weniger), in vielen Altbauten reichen auch große Heizkörper.</p></div><div class=\"card steck\"><h2>Steckbrief: Luftwärmepumpe (Einfamilienhaus)</h2><dl><dt>Kosten (ca.)</dt><dd>grob 25 000 bis 35 000 € vor staatlicher Förderung</dd><dt>Einsparung</dt><dd>Heizkosten je nach Strom- und Gaspreis etwas niedriger</dd><dt>CO₂</dt><dd>gegenüber Gas etwa 2 t pro Haushalt und Jahr</dd><dt>Lohnt sich nach</dt><dd>stark abhängig von Förderung und Preisen</dd></dl></div>"}, {"k": "info", "n": "6.1", "t": "Richtig heizen und lüften", "h": "<div class=\"eyebrow\">Teil 6 · Info 4 von 6</div><h1>Richtig heizen und lüften</h1><div class=\"text\"><p>Das Umweltbundesamt empfiehlt etwa 20 °C im Wohnzimmer, 18 °C in der Küche und 17 °C im Schlafzimmer. <b>Jedes Grad weniger spart etwa 6 % Heizenergie.</b> Gelüftet wird am besten mehrmals täglich für wenige Minuten mit weit geöffnetem Fenster (Stoßlüften). Ein dauerhaft gekipptes Fenster kühlt dagegen die Wände rund ums Fenster aus, verschwendet Wärme und kann Schimmel fördern.</p></div>"}, {"k": "info", "n": "6.1", "t": "Warmes Wasser", "h": "<div class=\"eyebrow\">Teil 6 · Info 5 von 6</div><h1>Warmes Wasser</h1><div class=\"text\"><p>Wasser kann viel Wärme aufnehmen: Um 1 Liter Wasser um 1 °C zu erwärmen, braucht man 4 190 Joule (die Wärmekapazität von Wasser). Weil 1 Wh = 3 600 J sind (siehe Teil 1), sind das 4 190 : 3 600 ≈ <b>1,16 Wh pro Liter und °C</b>. Duschwasser wird von etwa 10 °C auf 40 °C erwärmt, also um 30 °C. Ein normaler Duschkopf lässt 12 bis 15 Liter pro Minute durch, ein <b>Sparduschkopf</b> nur 6 bis 9 Liter. Er mischt Luft unter das Wasser, sodass der Strahl trotzdem kräftig wirkt. Noch günstiger ist ein <b>Durchflussbegrenzer</b>: ein kleiner Einsatz, der zwischen Schlauch und Armatur geschraubt wird. Am Wasserhahn erfüllt ein Strahlregler (Perlator) denselben Zweck. Weitere Tipps: kürzer duschen, beim Einseifen das Wasser abdrehen, Warmwasserrohre im Keller dämmen. Ein Haushalt duscht etwa 300-mal pro Person im Jahr (Schätzung).</p></div><div class=\"card steck\"><h2>Steckbrief: Sparduschkopf</h2><dl><dt>Kosten (ca.)</dt><dd>15 bis 40 €</dd><dt>Einsparung</dt><dd>etwa 40 % weniger warmes Wasser beim Duschen</dd><dt>CO₂</dt><dd>siehe Aufgabe</dd><dt>Lohnt sich nach</dt><dd>meist nach wenigen Monaten</dd></dl></div>"}, {"k": "info", "n": "6.1", "t": "Solarthermie", "h": "<div class=\"eyebrow\">Teil 6 · Info 6 von 6</div><h1>Solarthermie</h1><div class=\"text\"><p>Bei der Solarthermie erwärmt die Sonne in Kollektoren auf dem Dach eine Flüssigkeit. Sie gibt ihre Wärme im Speicher über einen Wärmetauscher an das Trinkwasser ab. Solarkreislauf und Trinkwasser sind zwei getrennte Kreisläufe, das Wasser vermischt sich nicht. Eine Anlage für das Warmwasser deckt etwa 60 % des Warmwasserbedarfs: Im Sommer reicht die Sonne fast allein, im Winter muss die Heizung nachhelfen. Man rechnet mit 1 bis 1,5 m² Kollektorfläche pro Person; 6 m² liefern etwa 2 000 kWh Wärme pro Jahr. Geeignet sind Dächer nach Osten, Süden oder Westen. Kosten: etwa 4 000 bis 6 000 € (Umweltbundesamt).</p></div><figure class=\"fig\"><img src=\"fig/solarthermie.png\" alt=\"solarthermie\" loading=\"lazy\"></figure>"}, {"k": "info", "t": "Warmes Wasser in den Wasserkocher – lohnt sich das?", "h": "<div class=\"eyebrow\">Teil 6 · Schon gewusst?</div><h1>Warmes Wasser in den Wasserkocher – lohnt sich das?</h1><div class=\"text\"><p>Spart man Geld, wenn man den Wasserkocher mit heißem Wasser aus der Leitung füllt? Ein Überschlag für 1 Liter: Kaltes Wasser (10 °C) zum Kochen zu bringen kostet etwa 4 Cent Strom. Mit 50 °C warmem Leitungswasser braucht der Wasserkocher nur gut die Hälfte, etwa 2 Cent. Das Vorwärmen hat die Heizung erledigt, mit Fernwärme für etwa 0,6 Cent. Rechnerisch spart man also gut 1 Cent pro Liter.</p><p>Aber: Bis das warme Wasser am Hahn ankommt, läuft erst kaltes Wasser ungenutzt ab, und das warme Wasser in der Leitung kühlt danach aus. Bei einem Liter frisst das den Vorteil meist auf. Außerdem gilt: Für Getränke und zum Kochen nur kaltes Leitungswasser verwenden, weil warmes Wasser mehr Stoffe aus Rohren und Armaturen lösen kann (Verbraucherschutz-Empfehlung). Fazit: Kalt einfüllen und nur so viel kochen, wie man wirklich braucht. Das spart mehr.</p></div>"}, {"k": "task", "n": "6.2", "t": "Informiere dich auf der Seite „Heizungsarten im …", "h": "<div class=\"eyebrow\">Teil 6 · Aufgabe 6.2 <span class=\"tag mappe\">✎ Mappe</span> <span class=\"tag star\">★ freiwillig</span></div><h1>Informiere dich auf der Seite „Heizungsarten im …</h1><p class=\"task-q\">Informiere dich auf der Seite <a href=\"https://www.co2online.de/modernisieren-und-bauen/heizung/heizungsarten-im-vergleich/\" target=\"_blank\" rel=\"noopener\">„Heizungsarten im Vergleich“ (co2online)</a> über die wichtigsten Heizungsarten und trage deine Ergebnisse in eine Tabelle in deiner Mappe ein.</p><div class=\"card\"><h2>Diese Tabelle legst du in deiner Mappe an</h2><div class=\"tbl\"><table class=\"grid\"><thead><tr><th>Heizungsart</th><th>Energieträger</th><th>ein Vorteil</th><th>ein Nachteil</th></tr></thead><tbody><tr><td>Gasheizung (Brennwert)</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>Ölheizung</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>Fernwärme</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>Holzpelletheizung</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>Wärmepumpe</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div></div><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Bearbeite die Aufgabe in deiner Mappe.</p></div></div><details class=\"tip\"><summary>Tipp 1</summary><div>Wenn die Seite von co2online nicht lädt, nutze diese Übersicht:<div class=\"tbl\"><table><thead><tr><th>Heizungsart</th><th>Energieträger</th><th>ein Vorteil</th><th>ein Nachteil</th></tr></thead><tbody><tr><td>Gasheizung</td><td>Erdgas</td><td>günstig in der Anschaffung</td><td>verursacht viel CO₂, Gaspreis kann steigen</td></tr><tr><td>Ölheizung</td><td>Heizöl</td><td>unabhängig vom Gasnetz</td><td>noch mehr CO₂, Tank braucht Platz</td></tr><tr><td>Fernwärme</td><td>Wärme aus Kraftwerk oder Abwärme</td><td>keine eigene Heizung im Haus nötig</td><td>man ist an einen Anbieter gebunden</td></tr><tr><td>Wärmepumpe</td><td>Strom und Umweltwärme</td><td>sehr wenig CO₂, wenn Ökostrom genutzt wird</td><td>teuer in der Anschaffung, braucht gut gedämmtes Haus</td></tr><tr><td>Pelletheizung</td><td>Holz</td><td>fast CO₂-neutral</td><td>Lager für Pellets nötig, Feinstaub</td></tr></tbody></table></div></div></details>", "star": true}, {"k": "task", "n": "6.3", "t": "Erkläre, wozu das Küstenkraftwerk einen großen …", "h": "<div class=\"eyebrow\">Teil 6 · Aufgabe 6.3 <span class=\"tag mappe\">✎ Mappe</span> <span class=\"tag star\">★ freiwillig</span></div><h1>Erkläre, wozu das Küstenkraftwerk einen großen …</h1><p class=\"task-q\">Erkläre, wozu das Küstenkraftwerk einen großen Wärmespeicher braucht. Tipp: Überlege, ob Strom und Wärme immer zur gleichen Zeit gebraucht werden.</p><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Bearbeite die Aufgabe in deiner Mappe.</p></div></div>", "star": true}, {"k": "task", "n": "6.4", "t": "Informiere dich im Artikel „Wärmeplanung", "h": "<div class=\"eyebrow\">Teil 6 · Aufgabe 6.4 <span class=\"tag mappe\">✎ Mappe</span> <span class=\"tag star\">★ freiwillig</span></div><h1>Informiere dich im Artikel „Wärmeplanung</h1><p class=\"task-q\">Informiere dich im Artikel <a href=\"https://www.kielerleben.de/news/waermeplanung-hier-baut-kiel-fernwaerme-10027854.html\" target=\"_blank\" rel=\"noopener\">„Wärmeplanung: Hier baut Kiel Fernwärme“ (Kieler Leben)</a>, wie die Stadt die Wärmeversorgung umbauen will. Notiere zwei Ergebnisse des Wärmeplans.</p><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Bearbeite die Aufgabe in deiner Mappe.</p></div></div>", "star": true}, {"k": "task", "n": "6.5", "t": "Erkläre mit dem Kühlschrank-Vergleich, wie eine …", "h": "<div class=\"eyebrow\">Teil 6 · Aufgabe 6.5 <span class=\"tag mappe\">✎ Mappe</span></div><h1>Erkläre mit dem Kühlschrank-Vergleich, wie eine …</h1><p class=\"task-q\">Erkläre mit dem Kühlschrank-Vergleich, wie eine Wärmepumpe aus kalter Winterluft Wärme für das Haus gewinnt. Erläutere, warum eine Erdwärmepumpe im Winter mehr Wärme aus 1 kWh Strom macht als eine Luftwärmepumpe.</p><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Bearbeite die Aufgabe in deiner Mappe.</p></div></div>"}, {"k": "task", "n": "6.6", "t": "Ein Haus braucht im Jahr 15 000 kWh Wärme", "h": "<div class=\"eyebrow\">Teil 6 · Aufgabe 6.6 <span class=\"tag mappe\">✎ Mappe</span> <span class=\"tag star\">★ freiwillig</span></div><h1>Ein Haus braucht im Jahr 15 000 kWh Wärme</h1><p class=\"task-q\">Ein Haus braucht im Jahr 15 000 kWh Wärme. Vergleiche eine Gasheizung mit einer Luftwärmepumpe (JAZ 3,5). Rechne mit diesen Werten: Gas 0,12 € und 0,24 kg CO₂ pro kWh, Wärmepumpen-Strom 0,28 € und 0,34 kg CO₂ pro kWh.</p><ul class=\"bullets\" style=\"list-style:none;padding-left:0\"><li>a) Berechne die Heizkosten mit Gas.  Rechenhilfe: Kosten = Wärmebedarf · Gaspreis</li><li>b) Berechne den Strombedarf und die Heizkosten der Wärmepumpe.  Rechenhilfe: Strombedarf = Wärmebedarf : JAZ</li><li>c) Berechne die Ersparnis pro Jahr in € und in kg CO₂.</li><li>d) Die Wärmepumpe kostet nach Förderung 12 000 € mehr als eine neue Gasheizung. Berechne, nach wie vielen Jahren sich der Mehrpreis bezahlt gemacht hat (Amortisation), und beurteile das Ergebnis.</li></ul><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Schreib den Rechenweg und die Ergebnisse mit Einheit in deine Mappe. Hier kannst du sie danach prüfen.</p></div></div><details class=\"tip\"><summary>Tipp 1</summary><div>a) Gas: 15 000 kWh · 0,12 € = … €.</div></details><details class=\"tip\"><summary>Tipp 2</summary><div>b) Die Wärmepumpe macht aus 1 kWh Strom 3,5 kWh Wärme. Strombedarf: 15 000 kWh : 3,5 ≈ 4 286 kWh. Kosten: 4 286 kWh · 0,28 € = … €.</div></details><details class=\"tip\"><summary>Tipp 3</summary><div>c) Ersparnis: Gaskosten minus Wärmepumpenkosten. CO₂: 15 000 kWh · 0,24 kg und 4 286 kWh · 0,34 kg ausrechnen und abziehen. d) 12 000 € geteilt durch die Ersparnis pro Jahr.</div></details><div class=\"card\"><h2>Ergebnis prüfen</h2><div class=\"check\"><label for=\"c6_6_0\">a) Gas<input id=\"c6_6_0\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"€\"></label><label for=\"c6_6_1\">b) Strombedarf<input id=\"c6_6_1\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"kWh\"></label><label for=\"c6_6_2\">b) Wärmepumpe<input id=\"c6_6_2\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"€\"></label><label for=\"c6_6_3\">c) Ersparnis<input id=\"c6_6_3\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"€\"></label><label for=\"c6_6_4\">c) CO₂-Ersparnis<input id=\"c6_6_4\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"kg\"></label><label for=\"c6_6_5\">d) Amortisationszeit<input id=\"c6_6_5\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"Jahre\"></label><button class=\"btn\" data-check=\"c6_6\">Prüfen</button></div><div class=\"fb\" id=\"c6_6_fb\" hidden></div><details class=\"tip\"><summary>Lösung anzeigen</summary><div class=\"sol\">a) 15 000 kWh · 0,12 € = <b>1 800 €</b><br>b) 15 000 kWh : 3,5 ≈ <b>4 286 kWh</b> Strom; 4 286 kWh · 0,28 € ≈ <b>1 200 €</b><br>c) 1 800 € − 1 200 € = <b>600 €</b> pro Jahr; CO₂: 3 600 kg − 1 457 kg ≈ <b>2 143 kg</b><br>d) 12 000 € : 600 € = <b>20 Jahre</b>. Finanziell dauert es lange, fürs Klima bringt die Wärmepumpe sehr viel.</div></details></div>", "star": true}, {"k": "task", "n": "6.7", "t": "Informiere dich auf den Seiten „Richtiges Heizen“ und …", "h": "<div class=\"eyebrow\">Teil 6 · Aufgabe 6.7 <span class=\"tag mappe\">✎ Mappe</span></div><h1>Informiere dich auf den Seiten „Richtiges Heizen“ und …</h1><p class=\"task-q\">Informiere dich auf den Seiten <a href=\"https://www.umweltbundesamt.de/umwe
