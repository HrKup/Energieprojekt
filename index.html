lttipps-fuer-den-alltag/heizen-bauen/heizen-raumtemperatur\" target=\"_blank\" rel=\"noopener\">„Richtiges Heizen“</a> und <a href=\"https://www.umweltbundesamt.de/themen/gesundheit/umwelteinfluesse-auf-den-menschen/schimmel/wie-luefte-ich-richtig-tipps-tricks-zu\" target=\"_blank\" rel=\"noopener\">„Wie lüfte ich richtig?“</a> (beide Umweltbundesamt).</p><ul class=\"bullets\" style=\"list-style:none;padding-left:0\"><li>a) Notiere die empfohlenen Raumtemperaturen für Wohnzimmer, Küche und Schlafzimmer.</li><li>b) Erkläre, warum ein dauerhaft gekipptes Fenster im Winter Energie verschwendet und Schimmel fördern kann.</li></ul><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Bearbeite die Aufgabe in deiner Mappe.</p></div></div><details class=\"tip\"><summary>Tipp 1</summary><div>Auf der Seite „Richtiges Heizen“ stehen die Temperaturen im Abschnitt mit den Empfehlungen für die Räume.</div></details>"}, {"k": "task", "n": "6.8", "t": "Die Warmduscher-Rechnung", "h": "<div class=\"eyebrow\">Teil 6 · Aufgabe 6.8 <span class=\"tag mappe\">✎ Mappe</span></div><h1>Die Warmduscher-Rechnung</h1><p class=\"task-q\">Die Warmduscher-Rechnung: Jemand duscht gern lange und warm. Rechne für eine Dusche mit Gasheizung (0,12 € und 0,24 kg CO₂ pro kWh Wärme; normaler Duschkopf 13 Liter pro Minute, Sparduschkopf 7 Liter pro Minute; Wasser von 10 °C auf 40 °C).</p><ul class=\"bullets\" style=\"list-style:none;padding-left:0\"><li>a) 15 Minuten mit normalem Duschkopf</li><li>b) 15 Minuten mit Sparduschkopf</li><li>c) 5 Minuten mit Sparduschkopf</li><li>d) Rechne alle drei auf ein Jahr hoch (300 Duschen).</li><li>e) Berechne, wie viel Prozent Energie c) gegenüber a) spart.</li><li>Rechenhilfe: Energie (Wh) = Liter · Temperaturunterschied (30 °C) · 1,16 Wh pro Liter und °C. Kosten = kWh · 0,12 €. CO₂ = kWh · 0,24 kg.</li><li>Trage deine Ergebnisse in eine Tabelle in deiner Mappe ein.</li></ul><div class=\"card\"><h2>Diese Tabelle legst du in deiner Mappe an</h2><div class=\"tbl\"><table class=\"grid\"><thead><tr><th></th><th>Wasser (Liter)</th><th>Energie (kWh)</th><th>Kosten (€)</th><th>CO₂ (kg)</th><th>pro Jahr: Energie (kWh)</th><th>pro Jahr: Kosten (€)</th></tr></thead><tbody><tr><td>a)</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>b)</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>c)</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div></div><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Schreib den Rechenweg und die Ergebnisse mit Einheit in deine Mappe. Hier kannst du sie danach prüfen.</p></div></div><details class=\"tip\"><summary>Tipp 1</summary><div>a) Erst die Liter: 15 Minuten · 13 Liter = 195 Liter. Dann die Energie: 195 Liter · 30 °C · 1,16 Wh ≈ 6 786 Wh, das sind etwa 6,8 kWh.</div></details><details class=\"tip\"><summary>Tipp 2</summary><div>Kosten und CO₂: 6,8 kWh · 0,12 € und 6,8 kWh · 0,24 kg. Für b) und c) rechnest du genauso mit 7 Litern pro Minute.</div></details><details class=\"tip\"><summary>Tipp 3</summary><div>d) Jedes Ergebnis mal 300. e) Unterschied zwischen a) und c) geteilt durch a), mal 100.</div></details><div class=\"card\"><h2>Ergebnis prüfen</h2><div class=\"check\"><label for=\"c6_8_0\">a) Energie<input id=\"c6_8_0\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"kWh\"></label><label for=\"c6_8_1\">b) Energie<input id=\"c6_8_1\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"kWh\"></label><label for=\"c6_8_2\">c) Energie<input id=\"c6_8_2\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"kWh\"></label><label for=\"c6_8_3\">d) a) pro Jahr<input id=\"c6_8_3\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"kWh\"></label><label for=\"c6_8_4\">e) Ersparnis<input id=\"c6_8_4\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"%\"></label><button class=\"btn\" data-check=\"c6_8\">Prüfen</button></div><div class=\"fb\" id=\"c6_8_fb\" hidden></div><details class=\"tip\"><summary>Lösung anzeigen</summary><div class=\"sol\">a) 195 l · 30 · 1,16 Wh ≈ <b>6,8 kWh</b>, 0,81 €, 1,6 kg CO₂<br>b) 105 l → <b>3,7 kWh</b>, 0,44 €, 0,9 kg<br>c) 35 l → <b>1,2 kWh</b>, 0,15 €, 0,3 kg<br>d) pro Jahr: a) <b>2 036 kWh</b> und 244 €, b) 1 096 kWh und 132 €, c) 365 kWh und 44 €<br>e) (6,8 − 1,2) : 6,8 · 100 ≈ <b>82 %</b></div></details></div>"}, {"k": "switch", "t": "Jetzt ins Protokoll", "h": "<div class=\"eyebrow\">Teil 6 · Wechsel <span class=\"tag proto\">▤ Protokoll</span></div><h1>Jetzt arbeitest du im Protokoll weiter</h1><div class=\"where-box proto\"><span class=\"ic\">▤</span><div>Öffne dein Protokoll, Teil 6<p>Dort arbeitest du mit den Zahlen deiner eigenen Wohnung oder deines Hauses.</p></div></div><div class=\"card\"><ol class=\"bullets\"><li>Trag die <b>Daten</b> ein, die du zu Hause erhoben hast.</li><li>Bearbeite die Aufgaben <b>6.1</b> bis <b>6.5</b>.</li><li>Schreib unter <b>Für dein Gutachten</b> deine Stichpunkte.</li></ol></div><div class=\"where-box mappe\"><span class=\"ic\">⌂</span><div>Hausaufgabe für die nächste Stunde<p>Finde zu Hause heraus, was du für Teil 7 brauchst. Hake ab, was du schon hast:</p><ul class=\"daten\"><li>Leistung der wichtigsten Geräte in Watt (Typenschild, meist hinten oder unten am Gerät) und ihre ungefähre Betriebszeit</li><li>Effizienzklasse von Kühlschrank, Waschmaschine und Geschirrspüler, Alter des Kühlschranks</li><li>Alle Geräte im Stand-by (Lämpchen, Display, Fernbedienung)</li></ul></div></div><p class=\"small\">Klicke auf „Aufgabe erledigt“, wenn du Teil 6 im Protokoll fertig hast.</p>"}]}, {"id": "teil7", "short": "Teil 7", "title": "Strom und Geräte", "slides": [{"k": "info", "t": "Darum geht es", "h": "<div class=\"eyebrow\">Teil 7 · Strom und Geräte</div><h1>Darum geht es</h1><div class=\"text\"><p class=\"lead\">Du lernst, wie viel Strom typische Geräte im Haushalt verbrauchen, woran du sparsame Geräte erkennst und wo „heimliche Stromfresser“ stecken.</p></div><div class=\"where-box proto\"><span class=\"ic\">▤</span><div>Bevor du beginnst<p>Hake ab, welche Daten von zu Hause du schon hast. Was noch fehlt, notierst du als Hausaufgabe.</p><ul class=\"daten\"><li>Leistung der wichtigsten Geräte in Watt (Typenschild, meist hinten oder unten am Gerät) und ihre ungefähre Betriebszeit</li><li>Effizienzklasse von Kühlschrank, Waschmaschine und Geschirrspüler, Alter des Kühlschranks</li><li>Alle Geräte im Stand-by (Lämpchen, Display, Fernbedienung)</li></ul></div></div>"}, {"k": "info", "n": "7.1", "t": "Leistung auf dem Typenschild", "h": "<div class=\"eyebrow\">Teil 7 · Info 1 von 3</div><h1>Leistung auf dem Typenschild</h1><div class=\"text\"><p>Die Leistung eines Geräts steht auf dem Typenschild, meist hinten oder unten. Wie viel Energie es im Jahr braucht, hängt aber auch davon ab, wie lange es läuft: Erinnerung aus Teil 1, <b>E = P · t</b>. Ein Föhn hat eine hohe Leistung, läuft aber nur wenige Minuten am Tag. Ein Kühlschrank hat eine kleine Leistung, läuft aber Tag und Nacht. Viele Geräte brauchen außerdem nicht immer ihre volle Leistung. Genau misst man den Verbrauch mit einem <b>Strommessgerät</b>, das zwischen Steckdose und Gerät gesteckt wird.</p></div><div class=\"card tbl\"><table><thead><tr><th>Gerät</th><th>typische Leistung</th><th>Nutzung</th><th>Energie pro Jahr (ca.)</th></tr></thead><tbody><tr><td>Kühlschrank, neu (Klasse A–C)</td><td>im Mittel 10–20 W</td><td>immer</td><td>100–150 kWh</td></tr><tr><td>Kühlschrank, 15 Jahre alt</td><td>im Mittel 35–45 W</td><td>immer</td><td>300–400 kWh</td></tr><tr><td>Waschmaschine</td><td>2 000 W beim Heizen</td><td>3-mal pro Woche</td><td>ca. 150 kWh</td></tr><tr><td>Fernseher</td><td>80–150 W</td><td>3 h täglich</td><td>ca. 100 kWh</td></tr><tr><td>Spielkonsole / PC</td><td>100–300 W</td><td>2 h täglich</td><td>70–220 kWh</td></tr><tr><td>WLAN-Router</td><td>8 W</td><td>immer</td><td>ca. 70 kWh</td></tr><tr><td>Wasserkocher</td><td>2 000 W</td><td>5 min täglich</td><td>ca. 60 kWh</td></tr></tbody></table></div>"}, {"k": "info", "n": "7.1", "t": "Stand-by: heimliche Stromfresser", "h": "<div class=\"eyebrow\">Teil 7 · Info 2 von 3</div><h1>Stand-by: heimliche Stromfresser</h1><div class=\"text\"><p>Viele Geräte verbrauchen auch dann Strom, wenn sie scheinbar aus sind: Fernseher im Bereitschaftsmodus, Ladegeräte in der Steckdose, Router, Drucker, Spielkonsolen im Ruhemodus. Einzeln sind das oft nur 1 bis 10 W, aber sie laufen rund um die Uhr. Diese <b>Leerlaufverluste</b> kosten die Haushalte in Deutschland zusammen mehrere Milliarden Euro pro Jahr (Umweltbundesamt). Abhilfe schaffen schaltbare Steckdosenleisten oder das Ausstecken von Ladegeräten.</p></div>"}, {"k": "info", "n": "7.1", "t": "Das Energielabel", "h": "<div class=\"eyebrow\">Teil 7 · Info 3 von 3</div><h1>Das Energielabel</h1><div class=\"text\"><p>Seit 2021 gilt für Kühlschränke, Waschmaschinen, Geschirrspüler, Fernseher und Lampen wieder die Skala <b>A bis G</b> (A = am sparsamsten). Die Klassen wurden dabei strenger: Ein früheres „A+++“-Gerät ist heute oft nur C oder D. Wichtiger als die Klasse ist die Zahl auf dem Label: der <b>Energieverbrauch in kWh pro Jahr</b>. Alte Kühl- und Gefriergeräte sind oft die größten Stromfresser im Haushalt.</p></div><div class=\"card steck\"><h2>Steckbrief: neuer Kühlschrank statt 15 Jahre altem Gerät</h2><dl><dt>Kosten (ca.)</dt><dd>etwa 500 bis 800 €</dd><dt>Einsparung</dt><dd>etwa 200 bis 250 kWh pro Jahr</dd><dt>CO₂</dt><dd>etwa 0,08 t pro Jahr</dd><dt>Lohnt sich nach</dt><dd>oft erst nach 7 bis 10 Jahren; sinnvoll, wenn das alte Gerät ersetzt werden muss</dd></dl></div>"}, {"k": "task", "n": "7.2", "t": "Ein Föhn mit 1 800 W läuft täglich 6 Minuten, ein …", "h": "<div class=\"eyebrow\">Teil 7 · Aufgabe 7.2 <span class=\"tag mappe\">✎ Mappe</span></div><h1>Ein Föhn mit 1 800 W läuft täglich 6 Minuten, ein …</h1><p class=\"task-q\">Ein Föhn mit 1 800 W läuft täglich 6 Minuten, ein WLAN-Router mit 8 W läuft immer. Berechne für beide die Energie und die Kosten pro Jahr (Strompreis 0,35 € pro kWh). Beurteile, welches Gerät mehr kostet, und erkläre das überraschende Ergebnis.</p><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Schreib den Rechenweg und die Ergebnisse mit Einheit in deine Mappe. Hier kannst du sie danach prüfen.</p></div></div><details class=\"tip\"><summary>Tipp 1</summary><div>Föhn: 1 800 W sind 1,8 kW, 6 Minuten sind 0,1 Stunden. Pro Tag: 1,8 kW · 0,1 h = 0,18 kWh. Mal 365 Tage, dann mal 0,35 €.</div></details><details class=\"tip\"><summary>Tipp 2</summary><div>Router: 8 W sind 0,008 kW. Er läuft das ganze Jahr, also 8 760 Stunden: 0,008 kW · 8 760 h = … kWh. Dann mal 0,35 €.</div></details><div class=\"card\"><h2>Ergebnis prüfen</h2><div class=\"check\"><label for=\"c7_2_0\">Föhn pro Jahr<input id=\"c7_2_0\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"kWh\"></label><label for=\"c7_2_1\">Föhn<input id=\"c7_2_1\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"€\"></label><label for=\"c7_2_2\">Router pro Jahr<input id=\"c7_2_2\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"kWh\"></label><label for=\"c7_2_3\">Router<input id=\"c7_2_3\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"€\"></label><button class=\"btn\" data-check=\"c7_2\">Prüfen</button></div><div class=\"fb\" id=\"c7_2_fb\" hidden></div><details class=\"tip\"><summary>Lösung anzeigen</summary><div class=\"sol\">Föhn: 0,18 kWh · 365 = <b>65,7 kWh</b>, 65,7 · 0,35 € ≈ <b>23,00 €</b><br>Router: 0,008 kW · 8 760 h ≈ <b>70,1 kWh</b>, ≈ <b>24,53 €</b><br>Der kleine Router kostet mehr, weil er nie ausgeschaltet wird.</div></details></div>"}, {"k": "task", "n": "7.3", "t": "Ein alter Kühlschrank braucht laut Messung 360 kWh pro …", "h": "<div class=\"eyebrow\">Teil 7 · Aufgabe 7.3 <span class=\"tag mappe\">✎ Mappe</span> <span class=\"tag star\">★ freiwillig</span></div><h1>Ein alter Kühlschrank braucht laut Messung 360 kWh pro …</h1><p class=\"task-q\">Ein alter Kühlschrank braucht laut Messung 360 kWh pro Jahr, ein neuer laut Energielabel 120 kWh. Der neue kostet 650 €.</p><ul class=\"bullets\" style=\"list-style:none;padding-left:0\"><li>a) Berechne die Ersparnis pro Jahr in kWh, € und kg CO₂ (Strom: 0,35 € und 0,34 kg CO₂ pro kWh).</li><li>b) Berechne die Amortisationszeit.</li><li>c) Beurteile, wann sich ein Austausch lohnt und wann nicht.</li></ul><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Schreib den Rechenweg und die Ergebnisse mit Einheit in deine Mappe. Hier kannst du sie danach prüfen.</p></div></div><details class=\"tip\"><summary>Tipp 1</summary><div>a) Ersparnis: 360 kWh − 120 kWh = 240 kWh. Dann mal 0,35 € und mal 0,34 kg.</div></details><details class=\"tip\"><summary>Tipp 2</summary><div>b) 650 € geteilt durch die Ersparnis in € pro Jahr.</div></details><div class=\"card\"><h2>Ergebnis prüfen</h2><div class=\"check\"><label for=\"c7_3_0\">a) Ersparnis<input id=\"c7_3_0\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"kWh\"></label><label for=\"c7_3_1\">a) Ersparnis<input id=\"c7_3_1\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"€\"></label><label for=\"c7_3_2\">a) CO₂<input id=\"c7_3_2\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"kg\"></label><label for=\"c7_3_3\">b) Amortisationszeit<input id=\"c7_3_3\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"Jahre\"></label><button class=\"btn\" data-check=\"c7_3\">Prüfen</button></div><div class=\"fb\" id=\"c7_3_fb\" hidden></div><details class=\"tip\"><summary>Lösung anzeigen</summary><div class=\"sol\">a) <b>240 kWh</b>, 240 · 0,35 € = <b>84 €</b>, 240 · 0,34 kg = <b>81,6 kg CO₂</b><br>b) 650 € : 84 € ≈ <b>7,7 Jahre</b><br>c) Lohnt sich, wenn der alte Kühlschrank viel verbraucht oder ohnehin kaputt ist. Ein noch gutes, sparsames Gerät weiterzunutzen ist oft besser, weil die Herstellung eines neuen auch Energie kostet.</div></details></div>", "star": true}, {"k": "task", "n": "7.4", "t": "Schlage zwei Maßnahmen gegen Stand-by-Verluste vor und …", "h": "<div class=\"eyebrow\">Teil 7 · Aufgabe 7.4 <span class=\"tag mappe\">✎ Mappe</span> <span class=\"tag star\">★ freiwillig</span></div><h1>Schlage zwei Maßnahmen gegen Stand-by-Verluste vor und …</h1><p class=\"task-q\">Schlage zwei Maßnahmen gegen Stand-by-Verluste vor und nenne jeweils einen Vor- und einen Nachteil.</p><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Bearbeite die Aufgabe in deiner Mappe.</p></div></div>", "star": true}, {"k": "switch", "t": "Jetzt ins Protokoll", "h": "<div class=\"eyebrow\">Teil 7 · Wechsel <span class=\"tag proto\">▤ Protokoll</span></div><h1>Jetzt arbeitest du im Protokoll weiter</h1><div class=\"where-box proto\"><span class=\"ic\">▤</span><div>Öffne dein Protokoll, Teil 7<p>Dort arbeitest du mit den Zahlen deiner eigenen Wohnung oder deines Hauses.</p></div></div><div class=\"card\"><ol class=\"bullets\"><li>Trag die <b>Daten</b> ein, die du zu Hause erhoben hast.</li><li>Bearbeite die Aufgaben <b>7.1</b> bis <b>7.2</b>.</li><li>Schreib unter <b>Für dein Gutachten</b> deine Stichpunkte.</li></ol></div><div class=\"where-box mappe\"><span class=\"ic\">⌂</span><div>Hausaufgabe für die nächste Stunde<p>Finde zu Hause heraus, was du für Teil 8 brauchst. Hake ab, was du schon hast:</p><ul class=\"daten\"><li>Anzahl der Lampen nach Typ (Glühlampe, Halogenlampe, Energiesparlampe, LED). Auf der Lampe oder der Verpackung stehen Watt und Lumen.</li><li>Wie viele Stunden pro Tag brennen die Lampen in den meistgenutzten Räumen ungefähr?</li></ul></div></div><p class=\"small\">Klicke auf „Aufgabe erledigt“, wenn du Teil 7 im Protokoll fertig hast.</p>"}]}, {"id": "teil8", "short": "Teil 8", "title": "Beleuchtung", "slides": [{"k": "info", "t": "Darum geht es", "h": "<div class=\"eyebrow\">Teil 8 · Beleuchtung</div><h1>Darum geht es</h1><div class=\"text\"><p class=\"lead\">Licht macht nur einen kleinen Teil des Stromverbrauchs aus, hier lässt sich aber besonders leicht sparen. Du lernst, wie die vier Lampenarten aufgebaut sind, warum sie so unterschiedlich sparsam sind und was bei Herstellung und Entsorgung zu beachten ist.</p></div><div class=\"where-box proto\"><span class=\"ic\">▤</span><div>Bevor du beginnst<p>Hake ab, welche Daten von zu Hause du schon hast. Was noch fehlt, notierst du als Hausaufgabe.</p><ul class=\"daten\"><li>Anzahl der Lampen nach Typ (Glühlampe, Halogenlampe, Energiesparlampe, LED). Auf der Lampe oder der Verpackung stehen Watt und Lumen.</li><li>Wie viele Stunden pro Tag brennen die Lampen in den meistgenutzten Räumen ungefähr?</li></ul></div></div>"}, {"k": "info", "n": "8.1", "t": "Lampen im Vergleich", "h": "<div class=\"eyebrow\">Teil 8 · Info 1 von 5</div><h1>Lampen im Vergleich</h1><figure class=\"fig\"><img src=\"fig/lampen_foto.png\" alt=\"Die vier Lampenarten und der Anteil der Energie, der als Licht bzw. als Wärme abgegeben wird\" loading=\"lazy\"><figcaption>Die vier Lampenarten und der Anteil der Energie, der als Licht bzw. als Wärme abgegeben wird</figcaption></figure>"}, {"k": "info", "n": "8.1", "t": "Glühlampe und Halogenlampe", "h": "<div class=\"eyebrow\">Teil 8 · Info 2 von 5</div><h1>Glühlampe und Halogenlampe</h1><div class=\"text\"><p>In der <b>Glühlampe</b> fließt Strom durch einen sehr dünnen Draht aus Wolfram, dem Metall mit dem höchsten Schmelzpunkt. Der Draht wird etwa 2 500 °C heiß und glüht. Damit er nicht verbrennt, ist der Glaskolben mit einem Schutzgas wie Argon gefüllt. Nur etwa 5 % der Energie werden zu Licht, der Rest wird als Wärme abgegeben. Die <b>Halogenlampe</b> ist eine verbesserte Glühlampe: Ein Halogengas im kleinen Innenkolben sorgt dafür, dass verdampftes Wolfram sich wieder am Draht ablagert. So kann der Draht heißer glühen und hält länger. Sie spart aber nur 20 bis 25 % gegenüber der Glühlampe. Deshalb dürfen beide in der EU seit einigen Jahren größtenteils nicht mehr verkauft werden.</p></div>"}, {"k": "info", "n": "8.1", "t": "Leuchtstofflampe („Energiesparlampe“)", "h": "<div class=\"eyebrow\">Teil 8 · Info 3 von 5</div><h1>Leuchtstofflampe („Energiesparlampe“)</h1><div class=\"text\"><p>In der gebogenen Glasröhre befindet sich etwas <b>Quecksilberdampf</b>. Eine Elektronik im Sockel (Vorschaltgerät) zündet eine Gasentladung, der Dampf sendet unsichtbares UV-Licht aus. Eine Leuchtstoffschicht auf der Innenseite der Röhre wandelt es in sichtbares Licht um. Energiesparlampen sparen 60 bis 85 % gegenüber der Glühlampe. Weil Quecksilber giftig ist, gehören sie in den <b>Sondermüll</b> bzw. zur Sammelstelle für Altlampen. Seit 2023 dürfen sie in der EU nicht mehr verkauft werden.</p></div>"}, {"k": "info", "n": "8.1", "t": "LED-Lampe", "h": "<div class=\"eyebrow\">Teil 8 · Info 4 von 5</div><h1>LED-Lampe</h1><div class=\"text\"><p>Eine <b>LED</b> (Leuchtdiode) ist ein winziger Halbleiter-Chip, der Strom direkt in Licht umwandelt. Weiße LEDs leuchten eigentlich blau, eine gelbe Leuchtstoffschicht macht daraus weißes Licht. Im Sockel steckt eine Treiber-Elektronik, außerdem ein Kühlkörper, denn auch LEDs werden warm, nur viel weniger. LEDs sind die sparsamsten und langlebigsten Lampen. Für ihre Herstellung braucht man allerdings Metalle wie Gallium und für die Leuchtstoffe Seltene Erden, deren Abbau die Umwelt belastet. Weil sie Elektronik enthalten, gehören LEDs nicht in den Hausmüll, sondern zum Wertstoffhof oder in die Sammelbox im Handel. Über die lange Lebensdauer fällt die Herstellung aber kaum ins Gewicht.</p></div>"}, {"k": "info", "n": "8.1", "t": "Wie hell ist eine Lampe?", "h": "<div class=\"eyebrow\">Teil 8 · Info 5 von 5</div><h1>Wie hell ist eine Lampe?</h1><div class=\"text\"><p>Die Helligkeit gibt der Lichtstrom in <b>Lumen (lm)</b> an, nicht die Leistung in Watt. Eine alte 60-W-Glühlampe liefert etwa 800 lm. Dieselbe Helligkeit schafft eine LED mit etwa 8 W.</p></div><div class=\"card tbl\"><table><thead><tr><th>Lampe</th><th>Lumen pro Watt (ca.)</th><th>Lebensdauer (Stunden, ca.)</th><th>Leistung für etwa 800 lm</th></tr></thead><tbody><tr><td>Glühlampe</td><td>12</td><td>1 000</td><td>60 W</td></tr><tr><td>Halogenlampe</td><td>15</td><td>2 000</td><td>46 W</td></tr><tr><td>Energiesparlampe</td><td>55</td><td>10 000</td><td>13 W</td></tr><tr><td>LED</td><td>100 bis 150</td><td>15 000 bis 25 000</td><td>8 W</td></tr></tbody></table></div><div class=\"card steck\"><h2>Steckbrief: LED statt Glühlampe (eine Lampe, 3 h täglich)</h2><dl><dt>Kosten (ca.)</dt><dd>etwa 3 bis 6 € pro LED</dd><dt>Einsparung</dt><dd>etwa 57 kWh, also rund 20 € pro Jahr</dd><dt>CO₂</dt><dd>etwa 20 kg pro Jahr</dd><dt>Lohnt sich nach</dt><dd>meist nach wenigen Monaten</dd></dl></div>"}, {"k": "task", "n": "8.2", "t": "Vergleiche eine Glühlampe (60 W, 1,50 €) mit einer LED …", "h": "<div class=\"eyebrow\">Teil 8 · Aufgabe 8.2 <span class=\"tag mappe\">✎ Mappe</span></div><h1>Vergleiche eine Glühlampe (60 W, 1,50 €) mit einer LED …</h1><p class=\"task-q\">Vergleiche eine Glühlampe (60 W, 1,50 €) mit einer LED (8 W, 5 €) über 15 000 Stunden Brenndauer.</p><ul class=\"bullets\" style=\"list-style:none;padding-left:0\"><li>a) Berechne, wie viele Glühlampen man in dieser Zeit braucht, und die Kaufkosten beider Varianten.</li><li>b) Berechne die Stromkosten beider Varianten (0,35 € pro kWh).</li><li>c) Beurteile das Ergebnis.</li></ul><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Schreib den Rechenweg und die Ergebnisse mit Einheit in deine Mappe. Hier kannst du sie danach prüfen.</p></div></div><details class=\"tip\"><summary>Tipp 1</summary><div>a) Eine Glühlampe hält etwa 1 000 Stunden (Tabelle). Für 15 000 Stunden brauchst du 15 000 : 1 000 = 15 Glühlampen. Kaufkosten: 15 · 1,50 €.</div></details><details class=\"tip\"><summary>Tipp 2</summary><div>b) Glühlampe: 60 W sind 0,06 kW. 0,06 kW · 15 000 h = … kWh, dann mal 0,35 €. LED genauso mit 0,008 kW.</div></details><div class=\"card\"><h2>Ergebnis prüfen</h2><div class=\"check\"><label for=\"c8_2_0\">a) Kauf Glühlampen<input id=\"c8_2_0\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"€\"></label><label for=\"c8_2_1\">b) Strom Glühlampe<input id=\"c8_2_1\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"€\"></label><label for=\"c8_2_2\">b) Strom LED<input id=\"c8_2_2\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"€\"></label><button class=\"btn\" data-check=\"c8_2\">Prüfen</button></div><div class=\"fb\" id=\"c8_2_fb\" hidden></div><details class=\"tip\"><summary>Lösung anzeigen</summary><div class=\"sol\">a) 15 Glühlampen · 1,50 € = <b>22,50 €</b>, LED: <b>5 €</b><br>b) Glühlampe: 900 kWh · 0,35 € = <b>315 €</b>; LED: 120 kWh · 0,35 € = <b>42 €</b><br>c) Die LED spart über ihre Lebensdauer rund 290 €.</div></details></div>"}, {"k": "switch", "t": "Jetzt ins Protokoll", "h": "<div class=\"eyebrow\">Teil 8 · Wechsel <span class=\"tag proto\">▤ Protokoll</span></div><h1>Jetzt arbeitest du im Protokoll weiter</h1><div class=\"where-box proto\"><span class=\"ic\">▤</span><div>Öffne dein Protokoll, Teil 8<p>Dort arbeitest du mit den Zahlen deiner eigenen Wohnung oder deines Hauses.</p></div></div><div class=\"card\"><ol class=\"bullets\"><li>Trag die <b>Daten</b> ein, die du zu Hause erhoben hast.</li><li>Bearbeite <b>Aufgabe 8.1</b>.</li><li>Schreib unter <b>Für dein Gutachten</b> deine Stichpunkte.</li></ol></div><p class=\"small\">Klicke auf „Aufgabe erledigt“, wenn du Teil 8 im Protokoll fertig hast.</p>"}]}, {"id": "teil9", "short": "Teil 9", "title": "CO₂-Bilanz", "slides": [{"k": "info", "t": "Darum geht es", "h": "<div class=\"eyebrow\">Teil 9 · CO₂-Bilanz</div><h1>Darum geht es</h1><div class=\"text\"><p class=\"lead\">Am Ende fragst du: Wie viel CO₂ verursacht deine Wohnung oder dein Haus, und welche Maßnahmen bringen fürs Klima wirklich viel? Du lernst, den CO₂-Fußabdruck einzuordnen, kritisch zu betrachten und mit politischen Entscheidungen in Beziehung zu setzen.</p></div><div class=\"where-box proto\"><span class=\"ic\">▤</span><div>Bevor du beginnst<p>Für diesen Teil brauchst du deine Ergebnisse aus Teil 6 und 7 im Protokoll. Neue Daten von zu Hause sind nicht nötig.</p></div></div>"}, {"k": "info", "n": "9.1", "t": "Was ist der CO₂-Fußabdruck?", "h": "<div class=\"eyebrow\">Teil 9 · Info 1 von 4</div><h1>Was ist der CO₂-Fußabdruck?</h1><div class=\"text\"><p>Der CO₂-Fußabdruck fasst zusammen, wie viele Treibhausgase ein Mensch im Jahr verursacht, umgerechnet in Tonnen CO₂. Dazu zählen Heizen und Strom, Mobilität, Ernährung und alles, was man kauft. In Deutschland liegt der Durchschnitt laut Umweltbundesamt bei rund <b>10 Tonnen pro Person</b> (2026 erstmals knapp darunter). Ein großer Teil davon entsteht beim Wohnen. Damit die Erderwärmung begrenzt werden kann, müsste er langfristig auf <b>unter 1 Tonne</b> sinken. Rund 1 Tonne pro Person entsteht dabei „öffentlich“, zum Beispiel durch Straßen, Schulen, Krankenhäuser und Verwaltung. Diesen Teil kann man allein kaum beeinflussen.</p></div>"}, {"k": "info", "n": "9.1", "t": "Woher kommt der Begriff?", "h": "<div class=\"eyebrow\">Teil 9 · Info 2 von 4</div><h1>Woher kommt der Begriff?</h1><div class=\"text\"><p>Die Idee des „ökologischen Fußabdrucks“ stammt aus den 1990er-Jahren von dem Wissenschaftler William Rees. Bekannt gemacht hat den <b>persönlichen CO₂-Fußabdruck</b> aber vor allem der Ölkonzern BP: In einer großen Werbekampagne ab etwa 2004 bot er einen der ersten Online-CO₂-Rechner an. Kritiker sehen darin den Versuch, die Verantwortung für den Klimawandel von den Unternehmen, die Öl und Gas fördern, auf die einzelnen Verbraucher zu verschieben. BP selbst bestreitet das. Der Fußabdruck ist trotzdem ein nützliches Werkzeug: Er zeigt, wo die großen Stellschrauben im eigenen Alltag liegen.</p></div>"}, {"k": "info", "n": "9.1", "t": "Was bringt wie viel?", "h": "<div class=\"eyebrow\">Teil 9 · Info 3 von 4</div><h1>Was bringt wie viel?</h1><div class=\"text\"><p>Nicht jede Maßnahme bringt gleich viel. Die Grafik vergleicht gerundete Richtwerte pro Person und Jahr. Manche Maßnahmen sind groß, aber teuer oder nur für Hausbesitzer möglich, andere sind klein, kosten aber fast nichts.</p></div><figure class=\"fig\"><img src=\"fig/co2.png\" alt=\"Eingesparte Tonnen CO₂ pro Person und Jahr (eigene Überschlagsrechnung mit den Richtwerten aus dem Anhang; Flüge nach atmosfair)\" loading=\"lazy\"><figcaption>Eingesparte Tonnen CO₂ pro Person und Jahr (eigene Überschlagsrechnung mit den Richtwerten aus dem Anhang; Flüge nach atmosfair)</figcaption></figure>"}, {"k": "info", "n": "9.1", "t": "Fußabdruck und Handabdruck", "h": "<div class=\"eyebrow\">Teil 9 · Info 4 von 4</div><h1>Fußabdruck und Handabdruck</h1><div class=\"text\"><p>Neben dem Fußabdruck gibt es den <b>Handabdruck</b> (Begriff der Organisation Germanwatch). Er steht für alles, womit man die Bedingungen für viele Menschen verändert: Wählen gehen, in der Schülervertretung oder im Verein mitreden, Ideen in der Schule umsetzen, mit Familie und Freunden über Lösungen sprechen. Ein Fernwärmenetz, ein guter Busverkehr oder günstiger Ökostrom entstehen durch politische Entscheidungen, und die beeinflussen am Ende viel mehr Tonnen CO₂ als ein einzelner Haushalt. <b>Beides zählt:</b> Das eigene Handeln ist nicht egal, und wer mitgestaltet, bewegt noch mehr.</p><p>Mehr Ideen zum Handabdruck: <a href=\"https://www.germanwatch.org/de/handabdruck\" target=\"_blank\" rel=\"noopener\">„Handabdruck“ (Germanwatch)</a></p></div>"}, {"k": "task", "n": "9.2", "t": "Ein Haushalt mit drei Personen heizt mit Fernwärme …", "h": "<div class=\"eyebrow\">Teil 9 · Aufgabe 9.2 <span class=\"tag mappe\">✎ Mappe</span> <span class=\"tag star\">★ freiwillig</span></div><h1>Ein Haushalt mit drei Personen heizt mit Fernwärme …</h1><p class=\"task-q\">Ein Haushalt mit drei Personen heizt mit Fernwärme (12 000 kWh pro Jahr) und verbraucht 2 700 kWh Strom. Rechne mit 0,24 kg CO₂ pro kWh Fernwärme und 0,34 kg CO₂ pro kWh Strom.</p><ul class=\"bullets\" style=\"list-style:none;padding-left:0\"><li>a) Berechne den CO₂-Ausstoß für Heizung und Strom pro Jahr, insgesamt und pro Person.</li><li>b) Vergleiche mit dem Fußabdruck einer Person in Deutschland (rund 10 t): Welchen Anteil hat das Wohnen?</li></ul><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Schreib den Rechenweg und die Ergebnisse mit Einheit in deine Mappe. Hier kannst du sie danach prüfen.</p></div></div><details class=\"tip\"><summary>Tipp 1</summary><div>a) Heizung: 12 000 kWh · 0,24 kg. Strom: 2 700 kWh · 0,34 kg. Zusammenzählen, dann durch 3 Personen teilen.</div></details><details class=\"tip\"><summary>Tipp 2</summary><div>b) Rechne kg in t um (durch 1 000) und vergleiche mit 10 t: Anteil = dein Wert : 10 · 100.</div></details><div class=\"card\"><h2>Ergebnis prüfen</h2><div class=\"check\"><label for=\"c9_2_0\">a) Heizung<input id=\"c9_2_0\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"kg\"></label><label for=\"c9_2_1\">a) Strom<input id=\"c9_2_1\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"kg\"></label><label for=\"c9_2_2\">a) pro Person<input id=\"c9_2_2\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"kg\"></label><label for=\"c9_2_3\">b) Anteil<input id=\"c9_2_3\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"%\"></label><button class=\"btn\" data-check=\"c9_2\">Prüfen</button></div><div class=\"fb\" id=\"c9_2_fb\" hidden></div><details class=\"tip\"><summary>Lösung anzeigen</summary><div class=\"sol\">a) Heizung <b>2 880 kg</b>, Strom <b>918 kg</b>, zusammen 3 798 kg, pro Person ≈ <b>1 266 kg</b> (1,3 t)<br>b) 1,27 t : 10 t · 100 ≈ <b>13 %</b></div></details></div>", "star": true}, {"k": "task", "n": "9.3", "t": "Übung: CO₂-Regler", "h": "<div class=\"eyebrow\">Teil 9 · Aufgabe 9.3 <span class=\"tag screen\">● hier am Bildschirm</span> <span class=\"tag mappe\">✎ Mappe</span></div><h1>Übung: CO₂-Regler</h1><p class=\"task-q\">Probiere aus, wie stark die Maßnahmen aus der Grafik den Fußabdruck eines Haushalts verändern. Trage dann für fünf Maßnahmen in eine Tabelle in deiner Mappe ein, wie groß ihre Wirkung ist und wie groß der Aufwand bzw. die Einschränkung. Kreuze die zwei Maßnahmen an, die du für dich oder deine Familie am sinnvollsten findest, und begründe deine Wahl in deiner Mappe.</p><div class=\"tool-frame\"><iframe src=\"tools/co2-regler.html\" title=\"CO₂-Regler\" loading=\"lazy\"></iframe></div><div class=\"card\"><h2>Diese Tabelle legst du in deiner Mappe an</h2><div class=\"tbl\"><table class=\"grid\"><thead><tr><th>Maßnahme</th><th>Wirkung (groß / mittel / klein)</th><th>Aufwand oder Einschränkung (groß / mittel / klein)</th><th>für uns sinnvoll? (x)</th></tr></thead><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div></div><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Bearbeite die Aufgabe in deiner Mappe.</p></div></div>"}, {"k": "task", "n": "9.4", "t": "„Was ich mache, ist doch egal.“ Nimm Stellung zu dieser …", "h": "<div class=\"eyebrow\">Teil 9 · Aufgabe 9.4 <span class=\"tag mappe\">✎ Mappe</span></div><h1>„Was ich mache, ist doch egal.“ Nimm Stellung zu dieser …</h1><p class=\"task-q\">„Was ich mache, ist doch egal.“ Nimm Stellung zu dieser Aussage. Beziehe dich auf den Fußabdruck und den Handabdruck und nenne ein Beispiel, wie du selbst einen Handabdruck hinterlassen könntest.</p><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Bearbeite die Aufgabe in deiner Mappe.</p></div></div>"}, {"k": "switch", "t": "Jetzt ins Protokoll", "h": "<div class=\"eyebrow\">Teil 9 · Wechsel <span class=\"tag proto\">▤ Protokoll</span></div><h1>Jetzt arbeitest du im Protokoll weiter</h1><div class=\"merk\">Geschafft! Jetzt schreibst du im Protokoll, Teil 10, dein Gutachten. Alle Bausteine dafür hast du in den Stichpunkten „Für dein Gutachten“ schon gesammelt.</div><div class=\"where-box proto\"><span class=\"ic\">▤</span><div>Öffne dein Protokoll, Teil 9<p>Dort arbeitest du mit den Zahlen deiner eigenen Wohnung oder deines Hauses.</p></div></div><div class=\"card\"><ol class=\"bullets\"><li>Bearbeite die Aufgaben <b>9.1</b> bis <b>9.2</b>.</li><li>Schreib unter <b>Für dein Gutachten</b> deine Stichpunkte.</li></ol></div><p class=\"small\">Klicke auf „Aufgabe erledigt“, wenn du Teil 9 im Protokoll fertig hast.</p>"}]}, {"id": "zusatz", "short": "★ Zusatz", "title": "Smart Home", "slides": [{"k": "info", "t": "Darum geht es", "h": "<div class=\"eyebrow\">★ Zusatz · Smart Home <span class=\"tag star\">★ freiwillig</span></div><h1>Darum geht es</h1><div class=\"text\"><p class=\"lead\">Dieser Teil ist freiwillig und wird nicht bewertet. Smarte Thermostate, Steckdosen und Lampen versprechen, Energie zu sparen. Du prüfst, was dran ist, und wägst Vor- und Nachteile ab.</p></div>"}, {"k": "info", "n": "Z.1", "t": "Was können smarte Geräte?", "h": "<div class=\"eyebrow\">★ Zusatz · Info 1 von 4</div><h1>Was können smarte Geräte?</h1><div class=\"text\"><p><b>Smarte Heizkörperthermostate</b> ersetzen den normalen Drehregler. Man steuert sie per App: Sie senken die Temperatur nach Zeitplan, etwa nachts oder wenn alle in der Schule und bei der Arbeit sind, erkennen ein offenes Fenster und drehen dann die Heizung ab. Manche merken über den Standort der Handys, ob jemand zu Hause ist. <b>Smarte Steckdosen</b> schalten Geräte nach Zeitplan ganz aus, <b>smarte Lampen</b> lassen sich dimmen und automatisch ausschalten.</p></div>"}, {"k": "info", "n": "Z.1", "t": "Wie viel sparen sie wirklich?", "h": "<div class=\"eyebrow\">★ Zusatz · Info 2 von 4</div><h1>Wie viel sparen sie wirklich?</h1><div class=\"text\"><p>Laut co2online spart eine programmierbare Heizungsregelung im Mittel etwa 10 % Heizkosten; andere Stellen nennen 9 bis 15 %. Herstellerangaben liegen oft deutlich höher. Viel bringen smarte Thermostate vor allem dort, wo vorher schlecht geregelt wurde, zum Beispiel wenn die Wohnung oft zu warm war oder tagsüber leer stand und trotzdem geheizt wurde. Wer ohnehin sorgfältig heizt, spart wenig. Ein Thermostat kostet etwa 40 bis 80 €. Achtung bei Steckdosen: Eine smarte Steckdose braucht selbst etwa 0,5 bis 1 W, rund um die Uhr. Hängt dahinter nur ein Gerät mit 1 W Stand-by, spart sie fast nichts. Smart heißt also nicht automatisch sparsam.</p></div>"}, {"k": "info", "n": "Z.1", "t": "Die Kehrseite: Daten und Abhängigkeit", "h": "<div class=\"eyebrow\">★ Zusatz · Info 3 von 4</div><h1>Die Kehrseite: Daten und Abhängigkeit</h1><div class=\"text\"><p>Smarte Thermostate wissen, wann jemand zu Hause ist. Solche <b>Anwesenheitsprofile</b> sind sensible Daten, die oft auf Servern des Herstellers gespeichert werden. Viele Geräte funktionieren nur mit der App und der Cloud eines bestimmten Herstellers. Stellt er den Dienst ein oder verlangt plötzlich Gebühren, sind die Geräte im schlimmsten Fall nutzlos. Geräte, die auch <b>ohne Internet</b> (lokal) und mit <b>offenen Standards</b> funktionieren, machen weniger abhängig.</p></div>"}, {"k": "info", "n": "Z.1", "t": "Schätzen statt messen", "h": "<div class=\"eyebrow\">★ Zusatz · Info 4 von 4</div><h1>Schätzen statt messen</h1><div class=\"text\"><p>Wie viel ein smartes Thermostat bei dir bringen könnte, kannst du grob schätzen: <b>Ersparnis ≈ 6 % · Absenkung in °C · (Stunden abwesend : 24)</b>. Beispiel: An 9 Stunden pro Tag 3 °C weniger ergibt 6 % · 3 · 9 : 24 ≈ 7 % Heizenergie. Das ist nur ein Überschlag: Das Wiederaufheizen kostet etwas Energie zurück, und gut gedämmte Häuser kühlen langsamer aus.</p><p>Informiere dich außerdem auf folgender Internetseite: <a href=\"https://www.co2online.de/energie-sparen/heizenergie-sparen/thermostate/smarte-thermostate/\" target=\"_blank\" rel=\"noopener\">„Smarte Thermostate“ (co2online)</a></p></div>"}, {"k": "task", "n": "Z.2", "t": "Wäge ab", "h": "<div class=\"eyebrow\">★ Zusatz · Aufgabe Z.2 <span class=\"tag mappe\">✎ Mappe</span></div><h1>Wäge ab</h1><p class=\"task-q\">Wäge ab: Lohnen sich smarte Thermostate für deine Wohnung oder dein Haus?</p><ul class=\"bullets\" style=\"list-style:none;padding-left:0\"><li>a) Stelle Vor- und Nachteile in einer Tabelle oder Liste gegenüber (Energie, Kosten, Bequemlichkeit, Daten, Abhängigkeit).</li><li>b) Schätze mit der Formel aus dem Info-Kasten, wie viel Prozent Heizenergie und wie viel Geld ihr sparen könntet. Notiere deine geschätzten Werte (Abwesenheit, Absenkung, Heizkosten aus dem Protokoll).</li><li>c) Fälle ein begründetes Urteil: Würdest du sie empfehlen? Wenn ja, worauf sollte man beim Kauf achten?</li></ul><div class=\"where-box mappe\"><span class=\"ic\">✎</span><div>In deine Mappe<p>Bearbeite die Aufgabe in deiner Mappe.</p></div></div>"}]}, {"id": "anhang", "short": "Anhang", "title": "Wenn dir Angaben fehlen", "slides": [{"k": "info", "t": "So gehst du vor", "h": "<div class=\"eyebrow\">Anhang</div><h1>Wenn dir Angaben fehlen</h1><div class=\"text\"><p>Gerade in Mietwohnungen bekommst du nicht alle Angaben, zum Beispiel weil die Heizkosten über die Nebenkosten abgerechnet werden. Dafür gibt es keinen Punktabzug. So gehst du vor:</p><ol class=\"bullets\"><li><b>Eigene Daten zuerst:</b> Frage Eltern, Vermieter oder Hausverwaltung, schau in Rechnungen, Verträge und auf Typenschilder. </li><li><b>Begründet schätzen:</b> Fehlt ein Wert trotzdem, nimm einen typischen Wert aus den Tabellen unten. </li><li><b>Kennzeichnen:</b> Markiere geliehene Werte im Protokoll mit „(Ø)“. Ø bedeutet Durchschnittswert. </li><li><b>Im Gutachten erklären:</b> Schreibe, welche Angaben fehlen, was du versucht hast und wie sicher deine Ergebnisse deshalb sind.</li></ol></div><h2>Typischer Energiekennwert für Heizung und Warmwasser nach Baujahr (unsaniert, grobe Richtwerte)</h2><div class=\"card tbl\"><table><thead><tr><th>Baujahr</th><th>bis 1948</th><th>1949–1978</th><th>1979–1994</th><th>1995–2001</th><th>2002–2015</th><th>ab 2016</th></tr></thead><tbody><tr><td>kWh pro m² und Jahr</td><td>ca. 200</td><td>ca. 200</td><td>ca. 150</td><td>ca. 110</td><td>ca. 80</td><td>ca. 50</td></tr></tbody></table></div><div class=\"text\"><p>Ist das Gebäude saniert (neue Fenster, gedämmtes Dach oder Fassade), liegt der Wert oft ein Viertel bis die Hälfte niedriger. Heizenergie pro Jahr ≈ Energiekennwert · Wohnfläche.</p></div><h2>Typischer Stromverbrauch pro Jahr (ohne elektrische Warmwasserbereitung, grobe Richtwerte)</h2><div class=\"card tbl\"><table><thead><tr><th>Personen im Haushalt</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody><tr><td>Wohnung</td><td>ca. 1 300 kWh</td><td>ca. 2 000 kWh</td><td>ca. 2 600 kWh</td><td>ca. 3 000 kWh</td><td>ca. 3 500 kWh</td></tr><tr><td>Haus</td><td>ca. 1 800 kWh</td><td>ca. 2 700 kWh</td><td>ca. 3 400 kWh</td><td>ca. 3 900 kWh</td><td>ca. 4 600 kWh</td></tr></tbody></table></div><div class=\"text\"><p>Wird das Wasser elektrisch erwärmt (Durchlauferhitzer, Boiler), kommen pro Person etwa 600 bis 800 kWh dazu. Einordnen kannst du deinen Verbrauch auch mit dem StromCheck (Link im Protokoll, Teil 7).</p></div><h2>Preise und CO₂ pro Kilowattstunde (gerundete Richtwerte)</h2><div class=\"text\"><p>CO₂ entsteht, wenn Kohle, Erdöl oder Erdgas verbrannt werden, im eigenen Haus oder in einem Kraftwerk. Bei den Heizungen stehen Preis und CO₂ pro kWh <b>Wärme</b>, damit du sie direkt vergleichen kannst.</p></div><div class=\"card tbl\"><table><thead><tr><th>Energie</th><th>Preis pro kWh</th><th>CO₂ pro kWh</th><th>Woher kommt das CO₂?</th></tr></thead><tbody><tr><td>Strom (Haushalt)</td><td>0,35 €</td><td>0,34 kg</td><td>Ein Teil des Stroms kommt noch aus Kohle- und Gaskraftwerken. Wind- und Solarstrom verursachen fast kein CO₂.</td></tr><tr><td>Erdgas</td><td>0,12 €</td><td>0,24 kg</td><td>Methan verbrennt im Brenner zu CO₂ und Wasser (etwa 0,20 kg), dazu Förderung, Transport und Verluste.</td></tr><tr><td>Heizöl</td><td>0,11 €</td><td>0,31 kg</td><td>Öl enthält mehr Kohlenstoff pro kWh als Erdgas, deshalb entsteht mehr CO₂.</td></tr><tr><td>Fernwärme Kiel</td><td>0,14 €</td><td>0,24 kg</td><td>vor allem Erdgas im Küstenkraftwerk, dazu Müllverbrennung (vereinfacht)</td></tr><tr><td>Holzpellets</td><td>0,08 €</td><td>0,03 kg</td><td>Holz gibt beim Verbrennen nur so viel CO₂ ab, wie der Baum aufgenommen hat. Der Rest stammt aus Herstellung und Transport.</td></tr><tr><td>Wärmepumpe</td><td>0,08 € pro kWh Wärme</td><td>0,10 kg pro kWh Wärme</td><td>aus dem Strom: Sie macht aus 1 kWh Strom (Sondertarif 0,28 €, 0,34 kg CO₂) etwa 3,5 kWh Wärme.</td></tr></tbody></table></div><div class=\"text\"><p class=small>(Quellen: CO₂ für Strom: Umweltbundesamt, Strommix 2025; übrige Werte gerundete Richtwerte. Eigene Preise aus euren Rechnungen sind immer besser.)</p><p><b>Warum ist das so?</b> In Kohle- und Gaskraftwerken geht mehr als die Hälfte der Energie als Abwärme verloren. Deshalb verursacht eine Kilowattstunde Strom mehr CO₂ als eine Kilowattstunde Erdgas, die direkt im Haus verbrannt wird. Strom ist außerdem teurer, weil auf ihm mehr Netzentgelte, Steuern und Abgaben liegen. Für Wärmepumpen bieten viele Stromanbieter einen günstigeren <b>Sondertarif</b> an, weil sie die Wärmepumpe bei hoher Netzlast kurz abschalten dürfen. Der Strom selbst ist derselbe, deshalb ist auch das CO₂ gleich. Preis und CO₂ haben also nichts miteinander zu tun.</p><p><b>Wichtig beim Vergleichen:</b> Vergleiche immer, was eine Kilowattstunde <b>Wärme</b> kostet und verursacht. Die Wärmepumpe braucht für 1 kWh Wärme nur etwa 0,3 kWh Strom und verursacht damit rund 0,1 kg CO₂, weniger als die 0,24 kg beim Erdgas.</p></div>"}]}];

{id:"start",short:"Start",title:"So funktioniert der Lernpfad",slides:[
 {k:"info",t:"Willkommen",h:`<div class="eyebrow">Start</div><h1>Du wirst Energieberaterin oder Energieberater</h1>
  <div class="text"><p class="lead">In den nächsten Wochen untersuchst du eine Wohnung oder ein Haus, sammelst Daten, nimmst Wärmebilder auf und schreibst am Ende ein Gutachten mit Verbesserungsvorschlägen.</p>
  <p>Dafür brauchst du nur zwei Dinge:</p></div>
  <div class="card"><h2>1. Diesen Lernpfad</h2><p>Hier lernst du Folie für Folie, was du für dein Gutachten wissen musst. Du übst mit Beispielzahlen. Rechenaufgaben löst du in deiner Mappe und prüfst sie hier. Der Lernpfad wird nicht benotet.</p></div>
  <div class="card"><h2>2. Dein Protokoll (Word-Datei)</h2><p>Das ist die einzige Datei, die du speichern musst. Dort trägst du die Daten deiner Wohnung oder deines Hauses ein, rechnest mit deinen eigenen Zahlen und schreibst am Ende dein Gutachten. Protokoll und Gutachten werden bewertet.</p></div>`},

 {k:"info",t:"Fortschritt sichern",h:`<div class="eyebrow">Start</div><h1>Am Stundenende: Fortschritt sichern</h1>
  <div class="text"><p>Der Lernpfad merkt sich, was du erledigt hast. An einem anderen Computer weiß er das aber nicht mehr. Deshalb sicherst du deinen Fortschritt in deinem Protokoll. Das dauert 10 Sekunden.</p></div>
  <div class="card"><h2>Stundenende</h2><ol class="bullets"><li>Klicke oben rechts auf <b>Fortschritt sichern</b>. Dein Code ist jetzt kopiert.</li><li>Öffne dein Protokoll, klicke auf Seite 1 in das Feld <b>Mein Fortschrittscode</b> und drücke <b>Strg + V</b>. Alten Code vorher markieren und überschreiben.</li><li>Protokoll speichern.</li></ol></div>

 {k:"info",t:"Dein Weg durch das Projekt",h:`<div class="eyebrow">Start</div><h1>Dein Weg durch das Projekt</h1>
  <div class="text"><p>Jeder Teil hat zwei Hälften: Erst lernst du hier im Lernpfad, dann arbeitest du im Protokoll mit deinen eigenen Daten. Die Punkte zeigen ungefähr, wann du an welchem Teil arbeiten solltest. Was du im Unterricht nicht schaffst, erledigst du zu Hause. Wird die Zeit knapp, lass die ★-Aufgaben weg.</p></div>
  <div class="card plan"><table id="planTbl"></table></div>
  <p class="small">Vor jedem Teil erhebst du zu Hause die Daten, die im Protokoll am Anfang des Teils stehen.</p>`},

{id:"teil1",short:"Teil 1",title:"Haus und Haushalt",slides:[
 {k:"info",t:"Darum geht es",h:`<div class="eyebrow">Teil 1 · Haus und Haushalt</div><h1>Rechnen mit Energie</h1>
  <div class="text"><p class="lead">Bevor du ein Haus oder eine Wohnung beurteilen kannst, musst du mit Energie rechnen können. Alles, was du hier übst, brauchst du in den späteren Teilen wieder.</p></div>
  <div class="card"><h2>Das lernst du in Teil 1</h2><ul class="bullets"><li>den Unterschied zwischen <b>Watt</b> und <b>Kilowattstunde</b></li><li>Einsparungen mit <b>Prozentrechnung</b> richtig berechnen</li><li><b>Kosten</b>, <b>Amortisationszeit</b> und <b>CO₂</b> ausrechnen</li><li>den <b>Energieausweis</b> lesen und selbst einen Energiekennwert bestimmen</li></ul></div>
  <div class="where-box proto"><span class="ic">▤</span><div>Bevor du beginnst<p>Hake ab, welche Daten von zu Hause du schon hast. Was noch fehlt, notierst du als Hausaufgabe.</p><ul class="daten"><li>Anzahl der Personen im Haushalt und Wohnfläche</li><li>Baujahr und, falls vorhanden, den Energieausweis</li><li>Heizverbrauch und Stromverbrauch pro Jahr mit Kosten (Jahresabrechnung, Eltern fragen)</li></ul></div></div>`},
 {k:"task",n:"1.1",t:"Wofür braucht ein Haushalt Energie?",h:`<div class="eyebrow">Teil 1 · Aufgabe 1.1 <span class="tag screen">● hier am Bildschirm</span></div><h1>Wofür braucht ein Haushalt Energie?</h1>
  <p class="task-q">Schätze, wie viel Prozent der Energie eines Haushalts für <b>Heizen</b>, für <b>warmes Wasser</b> und für <b>Strom</b> (Geräte, Licht, Kochen) gebraucht werden. Zusammen sind es 100 %.</p>
  <div class="card"><div class="check">
   <label for="e_h">Heizen in %<input id="e_h" inputmode="numeric" placeholder="%"></label>
   <label for="e_w">Warmwasser in %<input id="e_w" inputmode="numeric" placeholder="%"></label>
   <label for="e_s">Strom in %<input id="e_s" inputmode="numeric" placeholder="%"></label>
   <button class="btn primary" id="e_go">Mit dem Umweltbundesamt vergleichen</button></div>
   <div class="fb" id="e_fb" hidden></div>
   <div id="e_res" hidden style="display:flex;flex-direction:column;gap:10px"></div></div>
  <div id="e_pot" hidden class="card"><h2>Wo liegt das größte Einsparpotenzial?</h2><div class="classes" id="e_potBtns"></div><div class="fb" id="e_potFb" hidden></div></div>
  ${MAPPE.replace("Schreib den Rechenweg und das Ergebnis mit Einheit in deine Mappe. Hier kannst du dein Ergebnis danach prüfen.","Notiere deine Schätzung, die Werte des Umweltbundesamts und wo das größte Einsparpotenzial liegt.")}`},
 {k:"info",n:"1.2",t:"Leistung: Watt",h:`<div class="eyebrow">Teil 1 · Info 1 von 6</div><h1>Leistung: Watt</h1>
  <div class="text"><p>Die <b>Leistung P</b> gibt an, wie viel Energie ein Gerät <b>in jedem Moment</b> umsetzt. Ihre Einheit ist das <b>Watt (W)</b>. 1 000 W sind 1 kW.</p>
  <p>Ein Watt bedeutet: In jeder Sekunde wird 1 Joule Energie umgewandelt. Ein Wasserkocher mit 2 000 W setzt also in jeder Sekunde 2 000 Joule um, ganz egal, wie lange er läuft.</p>
  <p>Die Leistung steht auf dem <b>Typenschild</b> eines Geräts, meist hinten oder unten.</p></div>
  <div class="merk">Watt sagt, wie „stark“ ein Gerät gerade arbeitet.</div>`},
 {k:"info",n:"1.2",t:"Energie: Kilowattstunde",h:`<div class="eyebrow">Teil 1 · Info 2 von 6</div><h1>Energie: Kilowattstunde</h1>
  <div class="text"><p>Die <b>Energie E</b> gibt an, wie viel <b>insgesamt</b> umgesetzt wurde. Sie entsteht erst, wenn eine Leistung eine Zeit lang wirkt:</p></div>
  <div class="formula">Energie = Leistung · Zeit &nbsp; (E = P · t)</div>
  <div class="text"><p>Im Haushalt misst man Energie in <b>Kilowattstunden (kWh)</b>. Bezahlt wird immer die Energie: Auf der Stromrechnung stehen Kilowattstunden, nicht Watt.</p>
  <p><b>Beispiel:</b> Der Wasserkocher (2 kW) läuft 3 Minuten, also 0,05 h. E = 2 kW · 0,05 h = 0,1 kWh.</p>
  <p><b>Häufiger Fehler:</b> „Watt pro Stunde“ oder „W/h“ gibt es nicht. Watt ist schon eine Größe „pro Sekunde“.</p></div>
  <div class="merk">Watt steht auf dem Gerät, Kilowattstunden stehen auf der Rechnung.</div>`},
 {k:"info",n:"1.2",t:"Umrechnen",h:`<div class="eyebrow">Teil 1 · Info 3 von 6</div><h1>Umrechnen</h1>
  <div class="card tbl"><table><thead><tr><th>Umrechnen</th><th>so geht es</th></tr></thead><tbody>
   <tr><td>W ↔ kW</td><td>2 000 W = 2 kW (durch 1 000 teilen)</td></tr>
   <tr><td>Wh ↔ kWh</td><td>695 000 Wh = 695 kWh (durch 1 000 teilen)</td></tr>
   <tr><td>Minuten → Stunden</td><td>3 min = 3 : 60 h = 0,05 h; 30 min = 0,5 h</td></tr>
   <tr><td>Wh ↔ Joule</td><td>1 Wh = 1 W · 3 600 s = 3 600 J</td></tr>
   <tr><td>Tag → Jahr</td><td>mal 365; „immer an“ = 24 h · 365 = 8 760 h</td></tr></tbody></table></div>`},
 {k:"info",n:"1.2",t:"Prozent wovon?",h:`<div class="eyebrow">Teil 1 · Info 4 von 6</div><h1>Prozentrechnung: Prozent wovon?</h1>
  <div class="text"><p>Prozentangaben ergeben nur Sinn, wenn man weiß, <b>wovon</b> sie gerechnet werden. Das ist der Grundwert.</p></div>
  <div class="formula">Anteil = Grundwert · Prozentsatz : 100</div>
  <div class="card"><h2>Beispiel: Wand dämmen</h2><ul class="bullets"><li>Ein Haus verliert im Jahr 20 000 kWh Wärme.</li><li>30 % davon gehen durch die Wände: 20 000 kWh · 30 : 100 = <b>6 000 kWh</b>.</li><li>Eine Dämmung senkt <b>den Verlust der Wände</b> um 70 %: 6 000 kWh · 70 : 100 = <b>4 200 kWh</b> gespart.</li><li>Bezogen auf das ganze Haus: 4 200 : 20 000 · 100 = <b>21 %</b>, nicht 70 %!</li></ul></div>`},
 {k:"info",n:"1.2",t:"Kosten, Amortisation, CO₂",h:`<div class="eyebrow">Teil 1 · Info 5 von 6</div><h1>Kosten, Amortisation und CO₂</h1>
  <div class="formula">Kosten = Energie · Preis pro kWh</div>
  <div class="text"><p>Viele Sparmaßnahmen kosten erst einmal Geld. Die <b>Amortisationszeit</b> sagt, nach wie vielen Jahren sich die Anschaffung durch die Ersparnis bezahlt gemacht hat.</p></div>

const KEY="eb-lernpfad-v1";
let S={done:{},last:null};
CH.forEach(c=>S.done[c.id]=[]);
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r&&r.done){CH.forEach(c=>S.done[c.id]=r.done[c.id]||[]);S.last=r.last||null;}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const isDone=(c,i)=>(S.done[c]||[]).includes(i);
function setDone(c,i,v){const a=S.done[c];const k=a.indexOf(i);if(v&&k<0)a.push(i);if(!v&&k>=0)a.splice(k,1);save();}
function pct(c){const ch=CH.find(x=>x.id===c);if(!ch.slides.length)return 0;return Math.round(100*S.done[c].filter(i=>i<ch.slides.length).length/ch.slides.length);}

/* Fortschrittscode: Version + je Teil 32 Bit + letzte Folie, Base32 ohne verwechselbare Zeichen */
const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
/* Feste Bitbreite je Teil (Folienzahl + Reserve), damit Codes gültig bleiben, wenn Folien ergänzt werden */
const W={start:6,teil1:16,teil2:12,teil3:9,teil4:12,teil5:9,teil6:18,teil7:10,teil8:10,teil9:11,zusatz:8,anhang:3};
const wid=c=>W[c.id]||8;
function makeCode(){
  let bits="1";
  CH.forEach(c=>{const n=wid(c);let m=Array(n).fill("0");S.done[c.id].forEach(i=>{if(i<n)m[n-1-i]="1";});bits+=m.join("");});
  const li=S.last?CH.findIndex(c=>c.id===S.last[0]):0;bits+=Math.max(0,li).toString(2).padStart(4,"0")+(S.last?S.last[1]:0).toString(2).padStart(5,"0");
  let sum=0;for(const b of bits)sum=(sum*2+ +b)%31;bits+=sum.toString(2).padStart(5,"0");
  while(bits.length%5)bits+="0";
  let s="";for(let i=0;i<bits.length;i+=5)s+=A[parseInt(bits.substr(i,5),2)];
  return "EB-"+s.match(/.{1,5}/g).join("-");
}
function readCode(str){
  const s=String(str).toUpperCase().replace(/^EB-?/,"").replace(/[^A-Z0-9]/g,"");
  if(!s)return false;let bits="";for(const ch of s){const v=A.indexOf(ch);if(v<0)return false;bits+=v.toString(2).padStart(5,"0");}
  const tot=CH.reduce((a,c)=>a+wid(c),0),need=1+tot+9+5;if(bits.length<need||bits[0]!=="1")return false;
  const body=bits.slice(0,1+tot+9);let sum=0;for(const b of body)sum=(sum*2+ +b)%31;
  if(parseInt(bits.substr(body.length,5),2)!==sum)return false;
  let o=1;CH.forEach(c=>{const n=wid(c),m=bits.substr(o,n);S.done[c.id]=[];for(let i=0;i<n;i++)if(m[n-1-i]==="1")S.done[c.id].push(i);o+=n;});
  const li=parseInt(bits.substr(o,4),2),ls=parseInt(bits.substr(o+4,5),2);
  S.last=CH[li]?[CH[li].id,Math.min(ls,Math.max(0,CH[li].slides.length-1))]:null;save();return true;
}

function renderSide(cid){
  const sel=$("#chapSel");sel.innerHTML=`<option value="home">Übersicht</option>`+CH.filter(c=>c.slides.length).map(c=>`<option value="${c.id}" ${c.id===cid?"selected":""}>${c.short}: ${c.title}</option>`).join("");

/* Datenlisten zum Abhaken: Folie wird erst grün, wenn alle Daten da sind */
const DKEY="eb-daten-v1";let DAT={};try{DAT=JSON.parse(localStorage.getItem(DKEY)||"{}")||{};}catch(e){}
const dsave=()=>{try{localStorage.setItem(DKEY,JSON.stringify(DAT));}catch(e){}};
const dtext=h=>h.replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
function datenOf(s){if(s._d===undefined){const m=s.h.match(/<ul class="daten">([\s\S]*?)<\/ul>/);s._d=m?[...m[1].matchAll(/<li>([\s\S]*?)<\/li>/g)].map(x=>dtext(x[1])):null;}return s._d;}
const allHave=s=>{const d=datenOf(s);return !d||d.every(k=>DAT[k]);};
function syncDaten(){CH.forEach(c=>c.slides.forEach((s,i)=>{if(s.k==="info"&&datenOf(s)&&isDone(c.id,i)!==allHave(s))setDone(c.id,i,allHave(s));}));}
function wireDaten(cid,i){
  const s=chapter(cid).slides[i],d=datenOf(s);if(!d)return;

  const code=makeCode();let copied=false;
  const done=()=>{$("#dlg").innerHTML=`<h2>${copied?"Code kopiert":"Dein Fortschrittscode"}</h2>
   <p>${copied?"Öffne jetzt dein Protokoll, klicke auf Seite 1 in das Feld <b>Mein Fortschrittscode</b> und drücke <b>Strg + V</b>. Dann Protokoll speichern.":"Markiere den Code, kopiere ihn mit <b>Strg + C</b> und füge ihn im Protokoll auf Seite 1 bei <b>Mein Fortschrittscode</b> ein."}</p>
   <div class="code-box" id="codeShow">${code}</div><div><button class="btn primary" id="dlgClose">Fertig</button></div>`;
   $("#ov").hidden=false;$("#dlgClose").onclick=()=>$("#ov").hidden=true;$("#dlgClose").focus();
   if(!copied){const r=document.createRange();r.selectNodeContents($("#codeShow"));const s=getSelection();s.removeAllRanges();s.addRange(r);}};
  try{navigator.clipboard.writeText(code).then(()=>{copied=true;done();},()=>done());}catch(e){done();}
};
$("#ov").onclick=e=>{if(e.target.id==="ov")$("#ov").hidden=true;};

/* ---------- Interaktive Teile ---------- */
const K=[["A+",0,30,"#00843f"],["A",30,50,"#3aa935"],["B",50,75,"#8cc63f"],["C",75,100,"#d4e021"],["D",100,130,"#f3d81f"],["E",130,160,"#f4b120"],["F",160,200,"#ec7c1f"],["G",200,250,"#e2401f"],["H",250,1e9,"#b81e23"]];
const klasse=w=>K.findIndex(k=>w<k[2]);
function wire(){
  document.querySelectorAll("[data-scale]").forEach(sc=>{K.forEach(k=>{const d=document.createElement("div");d.style.background=k[3];if(k[0]==="C"||k[0]==="D"||k[0]==="B")d.style.color="#1b1b1b";d.innerHTML=k[0]+"<small>"+(k[2]>1e8?"über "+k[1]:k[0]==="A+"?"unter 30":k[1]+"–"+k[2])+"<br>kWh/m²</small>";sc.appendChild(d);});});
  document.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.check,F=CHECKS[id],fb=$("#"+id+"_fb");let ok=0,empty=0;
    F.forEach((f,i)=>{const v=num($("#"+id+"_"+i).value);if(isNaN(v))empty++;else if(Math.abs(v-f[0])<=f[1])ok++;});
    fb.hidden=false;
    if(empty){fb.className="fb bad";fb.textContent="Trag in jedes Feld eine Zahl ein (ohne Einheit).";}
    else if(ok===F.length){fb.className="fb ok";fb.textContent="Richtig! Klicke unten auf „Aufgabe erledigt“.";}
    else{fb.className="fb bad";fb.textContent=(F.length>1?ok+" von "+F.length+" richtig. ":"Noch nicht. ")+"Schau dir einen Tipp an und rechne noch einmal.";}
  });
  /* 1.1 Schätzung */
  if($("#e_go")){
    const U={h:70,w:15,s:15};const nm={h:"Heizen",w:"Warmwasser",s:"Strom"};
    $("#e_go").onclick=()=>{const v={h:num($("#e_h").value),w:num($("#e_w").value),s:num($("#e_s").value)};const fb=$("#e_fb");
      if([v.h,v.w,v.s].some(isNaN)){fb.hidden=false;fb.className="fb bad";fb.textContent="Trag erst alle drei Schätzungen ein.";return;}
      const sum=v.h+v.w+v.s;fb.hidden=false;fb.className=Math.abs(sum-100)<=2?"fb ok":"fb bad";fb.textContent="Deine Summe: "+de(sum,0)+" %"+(Math.abs(sum-100)<=2?"":". Eigentlich sollten es zusammen 100 % sein, aber du kannst trotzdem vergleichen.");
      const r=$("#e_res");r.hidden=false;
      r.innerHTML=`<div class="est"><span></span><span class="small">oben: deine Schätzung · unten: Umweltbundesamt</span><span></span>${["h","w","s"].map(k=>`<b>${nm[k]}</b><span style="display:flex;flex-direction:column;gap:3px"><span class="b"><i style="width:${Math.min(100,v[k])}%"></i></span><span class="b"><i class="uba" style="width:${U[k]}%"></i></span></span><span class="pct">${de(v[k],0)} %<br>${U[k]} %</span>`).join("")}</div>
       <p class="small">Werte gerundet: Umweltbundesamt, Anteile der Anwendungsbereiche am Endenergieverbrauch privater Haushalte 2024 („mehr als zwei Drittel“ fürs Heizen). Wer mag: <a href="https://www.umweltbundesamt.de/daten/private-haushalte-konsum/wohnen/energieverbrauch-privater-haushalte" target="_blank" rel="noopener">Seite des Umweltbundesamts</a>.</p>`;
      $("#e_pot").hidden=false;
      $("#e_potBtns").innerHTML=["h","w","s"].map(k=>`<button data-p="${k}" aria-pressed="false">${nm[k]}</button>`).join("");
      document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-p]").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");const f=$("#e_potFb");f.hidden=false;
        if(b.dataset.p==="h"){f.className="fb ok";f.textContent="Genau: Beim Heizen steckt der größte Anteil, also auch das größte Einsparpotenzial. Darum geht es in den Teilen 2 bis 6.";}
        else{f.className="fb bad";f.textContent="Auch hier lässt sich sparen. Aber schau auf die Balken: Wo ist der Anteil am größten?";}});
    };
  }
  /* 1.4 Übungshäuser + Rechner */
  if($("#houses")){
    const H=[["Wohnung im Mehrfamilienhaus","72 m², 9 000 kWh Fernwärme pro Jahr",9000/72],["Altbau von 1960","120 m², 2 800 m³ Erdgas pro Jahr",28000/120],["Neubau mit Wärmepumpe","140 m², 4 900 kWh Wärme pro Jahr",4900/140]];
    H.forEach((h,n)=>{const box=document.createElement("div");box.className="house";
      box.innerHTML="<div><b>"+(n+1)+". "+h[0]+"</b><br><span class='small'>"+h[1]+"</span></div><div class='classes' role='group' aria-label='Klasse wählen'></div><div class='fb' hidden style='grid-column:1/-1'></div>";
      const g=box.querySelector(".classes"),fb=box.querySelector(".fb"),right=klasse(h[2]);
      K.forEach((k,i)=>{const b=document.createElement("button");b.type="button";b.textContent=k[0];b.setAttribute("aria-pressed","false");
        b.onclick=()=>{g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");fb.hidden=false;
          if(i===right){fb.className="fb ok";fb.textContent="Richtig: "+de(h[2],0)+" kWh pro m² und Jahr, Klasse "+k[0]+".";}
          else{fb.className="fb bad";fb.textContent="Noch nicht. Rechne Energie (kWh) : Wohnfläche (m²)."+(n===1?" Denk an die Umrechnung von m³ in kWh.":"");}};
        g.appendChild(b);});
      $("#houses").appendChild(box);});
    const calc=()=>{const v=num($("#ea_v").value),f=num($("#ea_f").value),e=num($("#ea_e").value),out=$("#ea_out"),m=$("#ea_m");
      if(!(v>=0)||!(f>0)){out.textContent="Gib einen Verbrauch und eine Wohnfläche größer als 0 ein.";m.hidden=true;return;}
      const kwh=v*e,w=kwh/f,i=klasse(w);
      out.innerHTML=(e!==1?de(v,0)+" × 10 = "+de(kwh,0)+" kWh · ":"")+de(kwh,0)+" kWh : "+de(f,1)+" m² = <span class='big'>"+de(w,1)+" kWh pro m² und Jahr</span><br>Effizienzklasse <b>"+K[i][0]+"</b>";
      const lo=K[i][1],hi=Math.min(K[i][2],K[i][1]+100),pos=Math.min(1,(w-lo)/(hi-lo));m.hidden=false;m.style.left=((i+pos)/9*100)+"%";m.textContent="▼";};
    ["#ea_v","#ea_e","#ea_f"].forEach(s=>$(s).addEventListener("input",calc));calc();
  }
  /* Plan */
  if($("#planTbl")){$("#planTbl").innerHTML="<thead><tr><th>Teil</th>"+PLAN.dates.map(d=>"<th>"+d+"</th>").join("")+"</tr></thead><tbody>"+PLAN.rows.map(r=>"<tr><td>"+r[0]+"</td>"+PLAN.dates.map((d,k)=>"<td class='"+(r[1].includes(k)?"on":"")+"'></td>").join("")+"</tr>").join("")+"</tbody>";}
}

load();window.addEventListener("hashchange",route);route();
</script>
</body>
